name: Frontend checks
# Type-checks and builds the portfolio frontend, and type-checks and tests the
# package it shares with Hearthside, on pull requests that touch either.
# `npm run typecheck` (tsc) gives the quick answer. `next build` then runs the
# check the deploy runs: it also type-checks the route types Next generates
# under .next/types (page and layout exports and props), which a fresh
# checkout doesn't have, so tsc alone can't see them.
#
# The frontend and packages/* are one npm workspace (#209): one install at the
# root, from the root lockfile.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'frontend/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/frontend-checks.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  typecheck:
    name: Typecheck and build frontend
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck the shared package
        run: npm run typecheck --workspace @gtd/shared
      - name: Test the shared package
        run: npm test --workspace @gtd/shared
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
