<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthside Adventurers Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="bundle.css">
<style>
/* PROTOTYPE — throwaway. Three layouts of Hearthside's Characters page ("Adventurers" in the nav): your roster and
   one adventurer's own page, switchable from the bar at the bottom (or ← →). Game-system agnostic on purpose: a
   character is a name, art, a class and level in the player's own words, links to the campaign and sessions they
   played, and whatever else the player wants to say. The real sheet stays wherever it lives; Hearthside links to it.
   Data is made up, "today" is fixed at Mon Oct 26 2026, and everything lives in memory.
   Layout: the Hearthside AppShell (rail | page | letters over the lit floor); only .hs-page changes per variant. */
:root{
  color-scheme:dark;
  /* Hearthside tokens (from the design system's tokens.json; one theme, Tavern) */
  --ground:#1a130e;--ground-2:#241a13;--surface:#2c2119;--line:#4a3726;--text:#f1e6d0;--muted:#b8a487;
  --on-wood-text:#fbf1dc;--on-wood-muted:#d4c2a2;--accent:#e5a13a;--accent-ink:#1a130e;--seal:#b4462c;--moss:#7c9a55;
  --verdigris:#5aa396;--paper:#eadbb9;--paper-hi:#f0e3c4;--paper-lo:#e2cea5;--paper-ink:#2b1d12;--paper-muted:#6b5337;
  --paper-line:#c9b28a;--leather-hi:#37281c;--leather:#221810;--gold-hi:#f6dd96;--gold:#d6a84e;--gold-lo:#8a5c1c;
  --gold-line:rgba(226,184,98,0.38);--gold-rule:rgba(226,184,98,0.14);
  --heat-0:rgba(43,29,18,0.06);--heat-1:#d8c092;--heat-2:#c49a5c;--heat-3:#9c6c32;--heat-4:#5a3a1a;--firelight:#ffb36b;
  --font-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --font-story:"IM Fell English",Georgia,serif;
  --font-body:"Alegreya Sans",system-ui,sans-serif;
  --font-label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--sheet-foot:44px;
  --radius-sheet:3px;--radius:4px;--radius-panel:5px;--radius-full:999px;
  --shadow-panel:0 14px 30px rgba(0,0,0,0.55),0 2px 4px rgba(0,0,0,0.5);
  --shadow-panel-inset:inset 0 0 0 1px rgba(0,0,0,0.55),inset 0 0 26px rgba(0,0,0,0.5);
  --shadow-paper:0 16px 34px rgba(0,0,0,0.6),0 2px 4px rgba(0,0,0,0.45);
  --shadow-pin:0 2px 3px rgba(0,0,0,0.5);
  --on-wood-shadow:0 1px 2px rgba(0,0,0,0.9),0 0 14px rgba(0,0,0,0.6);
  /* the gilded panel's six-stop frame, for frames drawn here (portraits, medallions) */
  --gild:linear-gradient(135deg,#f6dd96 0%,#b07c2c 22%,#f0cf7a 45%,#7c5318 68%,#e7c06a 88%,#a87228 100%);
  /* the prototype switcher only: deliberately not Hearthside */
  --proto-bg:#fafafa;--proto-fg:#111;--proto-dim:#555;
}
body{margin:0;background:var(--ground);color:var(--text)}
.hs-shell-wrap{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hs-nav a{cursor:pointer}
/* on phones .hs-page is display:contents, so its sections are flex items of the shell: make them full width */
.hs-page > *{align-self:stretch;min-width:0}
.hs-app textarea,.hs-app select{font:inherit;color:inherit}

/* ---------- shared bits ---------- */
.p-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.p-head > div{min-width:0}
.p-new{height:36px;font-size:15px}
.p-back{height:32px;margin-bottom:12px;font-size:14px}
.p-link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.04em;text-decoration:none}
.p-link:hover{color:var(--gold-hi)}
.p-panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px 6px;
  font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--muted)}
.p-empty{padding:14px;color:var(--muted);font-size:14px}
.p-sheets{display:flex;flex-direction:column;gap:30px;padding-top:6px}
.hs-quests .hs-quest-for{font-size:13px;color:var(--muted);margin-top:2px}
.p-seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--radius);background:rgba(26,19,14,.82);border:1px solid var(--gold-line)}
.p-seg button{background:transparent;border:0;padding:5px 12px;border-radius:3px;cursor:pointer;color:var(--muted);
  font-family:var(--font-label);font-size:14px;font-weight:500;letter-spacing:.04em}
.p-seg button:hover{color:var(--text)}
.p-seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* a picture: fills its positioned parent. Painted stand-ins and uploads both become an .art-<id> class. */
.art{position:absolute;inset:0;background-size:cover;background-position:center}
/* a portrait, 3:4. No art yet: dyed cloth with the initials stitched on, like a campaign with no banner. */
.pt{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;background:var(--leather);container-type:inline-size}
.pt-none{position:absolute;inset:0;display:grid;place-items:center;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.12) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px),
    radial-gradient(120% 90% at 15% 100%,rgba(255,179,107,.2),transparent 55%),linear-gradient(160deg,#4a3324,#1c120b)}
.pt-none::after{content:"";position:absolute;inset:5%;border:1px dashed rgba(246,221,150,.4);border-radius:2px}
.pt-none span{font-family:var(--font-display);font-size:30cqw;letter-spacing:.06em;color:var(--gold-hi);opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.6)}
/* a face: the portrait zoomed onto the head, for round medallions and cameos */
.pt.is-face{aspect-ratio:1}
.pt.is-face .art{background-size:170% auto;background-position:50% 45%}
.pt.is-face .pt-none::after{inset:9%;border-radius:50%}
.pt.is-face .pt-none span{font-size:36cqw}
/* retired portraits fade toward sepia; fallen ones lose their colour */
.is-retired .art{filter:grayscale(.55) sepia(.3) brightness(.85)}
.is-fallen .art{filter:grayscale(1) brightness(.7) contrast(1.05)}
/* a portrait frame: the gilded panel's gold, a hairline inside */
.gframe{position:relative;display:block;border:3px solid transparent;border-radius:var(--radius-panel);overflow:hidden;
  background:linear-gradient(var(--leather),var(--leather)) padding-box,var(--gild) border-box;box-shadow:var(--shadow-panel)}
.gframe::after{content:"";position:absolute;inset:4px;border:1px solid rgba(246,221,150,.45);border-radius:2px;pointer-events:none;z-index:3}
.medal{position:relative;display:block;flex:none;border-radius:50%;overflow:hidden;border:2px solid transparent;
  background:linear-gradient(var(--leather),var(--leather)) padding-box,var(--gild) border-box;box-shadow:0 3px 8px rgba(0,0,0,.6)}
.medal .pt{border-radius:50%}
/* the level, as an amber seal. A game without levels gets none. */
.lvl{flex:none;width:58px;height:58px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:radial-gradient(circle at 35% 30%,#f3c070,var(--accent) 45%,#a8661c);color:var(--accent-ink);
  box-shadow:0 2px 6px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,230,170,.35)}
.lvl small{font:500 10px/1 var(--font-label);letter-spacing:.12em}
.lvl b{font:400 26px/1 var(--font-display)}
.is-fallen .lvl,.lvl.is-fallen,.is-retired .lvl,.lvl.is-retired{filter:grayscale(.7) brightness(.8)}
/* a campaign banner (4:1), as on the Campaigns page; cloth = no banner set */
.bn{position:absolute;inset:0;background-size:cover;background-position:center}
.bn.is-cloth{display:grid;place-items:center end;padding-right:8%;
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.12) 0 1px,transparent 1px 5px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 5px),
    radial-gradient(120% 140% at 15% 100%,rgba(255,179,107,.18),transparent 55%),linear-gradient(160deg,var(--c1),var(--c2))}
.bn.is-cloth::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(246,221,150,.4);border-radius:2px}
.bn.is-cloth span{font-family:var(--font-display);font-size:20px;letter-spacing:.12em;color:var(--gold-hi);opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.thumb{position:relative;display:inline-block;flex:none;width:40px;height:22px;border-radius:2px;overflow:hidden;vertical-align:-6px;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.6)}
.thumb .bn.is-cloth span{display:none}
/* a definition list on leather: facts and the player's own details */
.dl{margin:0;display:flex;flex-direction:column}
.dl > div{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr);gap:10px;padding:8px 14px;border-top:1px solid var(--gold-rule);align-items:baseline}
.dl > div:first-child{border-top:0}
.dl dt{font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--muted);overflow-wrap:anywhere}
.dl dd{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.dl .is-own dt{color:var(--on-wood-muted)}
.story{margin:0;padding:10px 14px 12px;font-family:var(--font-story);font-size:16px;line-height:1.45;color:var(--text);white-space:pre-line}
.ext{display:inline-flex;align-items:center;gap:6px}
.ext::after{content:"↗";font-family:var(--font-body)}
/* the next session's quests for this adventurer, on leather */
.nq{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.nq li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;font-size:13.5px}
.nq li.is-done span{text-decoration:line-through;color:var(--muted)}
.nq .hs-box{width:16px;height:16px;margin-top:1px}
.nq small{display:block;font-family:var(--font-label);font-size:12px;letter-spacing:.04em;color:var(--accent)}
.empty{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center;max-width:560px}
.empty .gframe{opacity:.9}
.empty h2{margin:0 0 4px;font-family:var(--font-story);font-weight:400;font-size:24px;color:var(--on-wood-text);text-shadow:var(--on-wood-shadow)}
.empty p{margin:0 0 12px;color:var(--on-wood-muted);text-shadow:var(--on-wood-shadow);font-size:15px}
@media (max-width:520px){.empty{grid-template-columns:96px minmax(0,1fr);gap:14px}}

/* ---------- A: Portrait gallery. Portraits hung on the floor; an adventurer's page leads with their art. ---------- */
.va-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:30px 22px;padding-top:4px}
.va-card{display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:center;font:inherit;min-width:0}
.va-card .gframe{width:100%}
.va-card:hover .gframe{box-shadow:var(--shadow-panel),0 0 0 2px rgba(246,221,150,.35)}
/* the brass name plate, screwed to the frame's foot */
.va-plate{position:relative;z-index:4;margin-top:-14px;max-width:92%;min-width:66%;padding:6px 12px 7px;border-radius:2px;
  background:linear-gradient(180deg,#f4d98e,#d7ab55 55%,#b88834);box-shadow:0 3px 6px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.4);color:var(--accent-ink)}
.va-plate::before,.va-plate::after{content:"";position:absolute;top:50%;margin-top:-2.5px;width:5px;height:5px;border-radius:50%;background:#7c5318;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.va-plate::before{left:4px}.va-plate::after{right:4px}
.va-plate b{display:block;font-family:var(--font-story);font-weight:400;font-size:17px;line-height:1.15;text-shadow:0 1px 0 rgba(255,240,200,.5);overflow-wrap:anywhere}
.va-plate small{display:block;font-family:var(--font-label);font-size:12.5px;font-weight:500;letter-spacing:.05em;color:#4a3112}
.va-under{margin-top:8px;font-size:13px;color:var(--on-wood-muted);text-shadow:var(--on-wood-shadow);max-width:100%;overflow-wrap:anywhere}
.va-under b{display:block;font-family:var(--font-label);font-weight:500;font-size:12.5px;letter-spacing:.05em;color:var(--accent)}
/* fallen: a black ribbon across the frame's corner */
.va-ribbon{position:absolute;z-index:4;top:16px;right:-34px;width:130px;transform:rotate(45deg);text-align:center;padding:3px 0;
  background:#120c08;color:var(--muted);font:500 11.5px/1.2 var(--font-label);letter-spacing:.14em;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.va-new{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;aspect-ratio:3/4;justify-content:center;border:1.5px dashed var(--gold-line);border-radius:var(--radius-panel);
  background:rgba(26,19,14,.45);color:var(--on-wood-text);font-family:var(--font-label);font-size:15px;font-weight:500;letter-spacing:.04em;text-shadow:var(--on-wood-shadow)}
.va-new i{font-style:normal;font-family:var(--font-display);font-size:40px;line-height:1;color:var(--accent)}
.va-card:hover .va-new{border-color:var(--gold)}
@media (max-width:520px){.va-wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}.va-plate{min-width:0;padding:5px 9px 6px}.va-plate b{font-size:15.5px}}
/* an adventurer's page */
.ad{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--space-6);align-items:start}
.ad-art{display:flex;flex-direction:column;gap:12px;min-width:0}
.ad-main .pt{aspect-ratio:3/4}
.ad-strip{display:flex;flex-wrap:wrap;gap:8px}
.ad-th{position:relative;width:54px;height:72px;padding:0;border:2px solid transparent;border-radius:3px;overflow:hidden;cursor:pointer;
  background:linear-gradient(var(--leather),var(--leather)) padding-box,linear-gradient(var(--line),var(--line)) border-box;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.ad-th.is-on{background:linear-gradient(var(--leather),var(--leather)) padding-box,var(--gild) border-box}
.ad-add{display:grid;place-items:center;color:var(--accent);font:400 26px/1 var(--font-display);border-style:dashed;border-color:var(--gold-line);background:rgba(26,19,14,.6)}
.ad-artnote{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--on-wood-muted);text-shadow:var(--on-wood-shadow)}
.ad-info{display:flex;flex-direction:column;gap:var(--space-5);min-width:0}
.ad-id{display:flex;align-items:center;gap:14px;padding:12px 14px 10px;border-bottom:1px solid var(--gold-rule)}
.ad-id b{display:block;font-family:var(--font-story);font-weight:400;font-size:22px;line-height:1.15}
.ad-id small{display:block;font-size:13.5px;color:var(--muted)}
.ad-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--gold-rule)}
.ad-foot .hs-btn-amber{height:32px}
.ad-sess{list-style:none;margin:0;padding:0}
.ad-sess > li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 14px;border-top:1px solid var(--gold-rule)}
.ad-sess > li:first-child{border-top:0}
.ad-sess time{font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.ad-sess > li.is-next{background:linear-gradient(90deg,rgba(229,161,58,.14),rgba(229,161,58,0))}
.ad-sess > li.is-next time{color:var(--accent)}
.ad-sess b{display:block;font-weight:500;font-size:14.5px}
.ad-sess small{display:block;font-size:13px;color:var(--muted)}
.ad-sess .hs-tag{margin-left:0}
.ad-sess .is-up{border-color:var(--gold);color:var(--gold-hi)}
.ad-camp{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.ad-bn{position:relative;display:block;aspect-ratio:4/1;border:0;padding:0;cursor:pointer;width:100%;overflow:hidden;border-radius:3px 3px 0 0}
.ad-bn::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(20,13,8,.9) 0%,rgba(20,13,8,.5) 50%,rgba(20,13,8,0) 80%)}
.ad-bn span.t{position:absolute;z-index:2;left:14px;top:50%;transform:translateY(-50%);text-align:left;max-width:70%}
.ad-bn b{display:block;font-family:var(--font-story);font-weight:400;font-size:21px;line-height:1.1;color:var(--on-wood-text);text-shadow:var(--on-wood-shadow)}
.ad-bn small{display:block;font-family:var(--font-label);font-size:12.5px;font-weight:500;letter-spacing:.05em;color:var(--on-wood-muted);text-shadow:var(--on-wood-shadow)}
.mates{display:flex;flex-wrap:wrap;gap:10px 16px;padding:10px 14px 12px}
.mate{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left;font:inherit;min-width:0}
.mate .medal{width:38px}
.mate b{display:block;font-weight:500;font-size:14px;line-height:1.2}
.mate small{display:block;font-size:12.5px;color:var(--muted)}
@media (max-width:759px){.ad{grid-template-columns:minmax(0,1fr)}.ad-art{max-width:380px;width:100%;margin:0 auto}}
@media (max-width:520px){.ad-sess > li{grid-template-columns:60px minmax(0,1fr)}.ad-sess > li > :last-child:not(:nth-child(2)){grid-column:2;justify-self:start}}

/* ---------- B: Ledger and sheet. A roster on leather; the chosen adventurer's sheet is parchment below. ---------- */
.vb-ledger{padding:6px}
.vb-ledger .hs-tabs{padding:0 8px}
.vb-ledger .hs-tabs button span{color:var(--muted);font-family:var(--font-body);font-size:12px;margin-left:4px}
.vb-rows{list-style:none;margin:0;padding:0}
.vb-rows li{border-top:1px solid var(--gold-rule)}
.vb-rows li:first-child{border-top:0}
.vb-row{display:grid;grid-template-columns:46px minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:3px}
.vb-row:hover{background:rgba(229,161,58,.06)}
.vb-row[aria-pressed="true"]{background:rgba(229,161,58,.13);box-shadow:inset 0 0 0 1px var(--gold)}
.vb-row .medal{width:46px}
.vb-n b{display:block;font-weight:500;font-size:15px;line-height:1.25}
.vb-n small,.vb-c small{display:block;font-size:13px;color:var(--muted)}
.vb-c{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.vb-c span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb-s{font-family:var(--font-label);font-size:12.5px;font-weight:500;letter-spacing:.04em;color:var(--accent);text-align:right;white-space:nowrap}
.vb-s.is-off{color:var(--muted)}
.vb-addrow{display:flex;justify-content:flex-end;padding:8px 12px 6px;border-top:1px solid var(--gold-rule)}
@media (max-width:620px){.vb-row{grid-template-columns:42px minmax(0,1fr) auto}.vb-row .medal{width:42px}.vb-c{display:none}}
/* the sheet */
.vb-top{display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:20px;align-items:start}
.vb-photo{position:relative;display:block;padding:6px 6px 22px;background:#f6eedb;transform:rotate(2.2deg);box-shadow:0 3px 8px rgba(43,29,18,.45);margin-top:-6px}
.vb-photo .pt{box-shadow:inset 0 0 0 1px rgba(43,29,18,.3)}
/* two strips of tape hold the picture on */
.vb-photo::before,.vb-photo::after{content:"";position:absolute;z-index:2;width:46px;height:16px;background:rgba(240,226,190,.75);box-shadow:0 1px 2px rgba(43,29,18,.25)}
.vb-photo::before{top:-7px;left:-12px;transform:rotate(-38deg)}
.vb-photo::after{top:-7px;right:-12px;transform:rotate(38deg)}
.vb-cap{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--font-story);font-style:italic;font-size:13px;color:var(--paper-muted)}
.vb-sheet .hs-ledger li span:first-child{font-family:var(--font-label);font-weight:500;letter-spacing:.05em;color:var(--paper-muted)}
.vb-sheet .hs-ledger li span:last-child{text-align:right;overflow-wrap:anywhere}
.vb-sheet .hs-ledger{margin-top:14px}
.vb-h{margin:20px 0 4px;font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.1em;color:var(--paper-muted)}
.vb-story{margin:0;font-family:var(--font-story);font-size:16px;line-height:1.5;white-space:pre-line;max-width:62ch}
.vb-kept{margin:12px 0 0;font-size:14px;color:var(--paper-muted)}

<script>
document.body.classList.add('hs-app');

/* ---------------- stand-in art: banners as in the Campaigns prototype, and painted portraits for uploads ---------------- */
function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function ridge(ctx, r, W, y0, amp, step, color, H = 400) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  let y = y0; for (let x = 0; x <= W + step; x += step) { y = Math.max(y0 - amp, Math.min(y0 + amp, y + (r() - .5) * amp)); ctx.lineTo(x, y); }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function paintBanner(kind) {
  const W = 1600, H = 400, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), r = rng(kind);
  const sky = (stops) => { const g = ctx.createLinearGradient(0, 0, 0, H); stops.forEach(([o, col]) => g.addColorStop(o, col)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  if (kind === 'ashen') {
    sky([[0, '#2a0f0c'], [.55, '#7a2a14'], [.8, '#d0652a'], [1, '#f2a24a']]);
    for (let i = 0; i < 220; i++) { ctx.fillStyle = `rgba(230,200,180,${r() * .35})`; ctx.fillRect(r() * W, r() * H * .8, 2, 2); }
    ridge(ctx, r, W, 250, 60, 40, '#3a1710');
    ridge(ctx, r, W, 300, 30, 30, '#1c0b08');
    ctx.fillStyle = '#0e0605';
    const kx = 1060; ctx.fillRect(kx, 170, 160, 140);
    [[kx - 30, 140, 40, 170], [kx + 60, 110, 40, 200], [kx + 150, 140, 40, 170]].forEach(([x, y, w, h]) => {
      ctx.fillRect(x, y, w, h); for (let i = 0; i < 3; i++) ctx.fillRect(x + i * 15, y - 12, 9, 12);
    });
    ctx.fillStyle = 'rgba(255,170,80,.8)'; [[kx + 76, 140], [kx + 20, 210], [kx + 120, 230]].forEach(([x, y]) => ctx.fillRect(x, y, 6, 10));
    ridge(ctx, r, W, 360, 14, 24, '#070303');
  } else if (kind === 'starfall') {
    sky([[0, '#060a1c'], [.6, '#13294a'], [1, '#2f6a74']]);
    for (let i = 0; i < 380; i++) { const s = r(); ctx.fillStyle = `rgba(255,255,240,${.3 + s * .7})`; ctx.fillRect(r() * W, r() * H * .75, s > .93 ? 3 : 1.5, s > .93 ? 3 : 1.5); }
    const g = ctx.createLinearGradient(300, 40, 760, 220); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,236,190,.95)');
    ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(300, 40); ctx.lineTo(760, 220); ctx.stroke();
    ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(762, 221, 6, 0, 7); ctx.fill();
    ridge(ctx, r, W, 300, 26, 60, '#3a3550');
    ctx.fillStyle = '#16142a'; ctx.beginPath();
    ctx.moveTo(380, 330); ctx.quadraticCurveTo(520, 200, 720, 300); ctx.lineTo(700, 330); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 6; i++) { ctx.fillRect(430 + i * 45, 250 - Math.sin(i / 5 * Math.PI) * 30, 7, 90); }
    ridge(ctx, r, W, 350, 18, 50, '#0b0a18');
  } else if (kind === 'lantern') {   // a road at dusk, lanterns along it
    sky([[0, '#15122a'], [.5, '#3b2a4a'], [.82, '#a0553a'], [1, '#e3954c']]);
    for (let i = 0; i < 90; i++) { ctx.fillStyle = `rgba(255,240,220,${r() * .6})`; ctx.fillRect(r() * W, r() * H * .45, 1.5, 1.5); }
    ridge(ctx, r, W, 250, 50, 50, '#2c1f2e');
    ridge(ctx, r, W, 305, 26, 36, '#180f19');
    ctx.fillStyle = 'rgba(236,180,110,.32)'; ctx.beginPath();
    ctx.moveTo(560, 400); ctx.quadraticCurveTo(760, 330, 980, 300); ctx.lineTo(1000, 300); ctx.quadraticCurveTo(820, 340, 760, 400); ctx.closePath(); ctx.fill();
    ctx.shadowColor = '#ffb36b'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffd08a';
    [[640, 372], [730, 345], [810, 326], [880, 313], [940, 305], [985, 300]].forEach(([x, y], i) => { ctx.beginPath(); ctx.arc(x, y - 8, 5 - i * .6, 0, 7); ctx.fill(); });
    ctx.shadowBlur = 0;
  }
  return c.toDataURL('image/jpeg', .85);
}

/* A portrait stand-in: a silhouette against a painted backdrop, rim-lit from the left (where the hearth is), with
   a few glints. What an uploaded commission, sketch or token would sit in. p: bg, body, rim, gear, motif, glow. */
function paintPortrait(p) {
  const W = 480, H = 640, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), r = rng(p.seed);
  let g = ctx.createRadialGradient(W * .38, H * .32, 20, W * .5, H * .5, H * .8);
  g.addColorStop(0, p.bg[0]); g.addColorStop(1, p.bg[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  motif(ctx, r, p.motif, W, H);
  figure(ctx, p, -7, -2, p.rim || '#ffb36b');
  figure(ctx, p, 0, 0, p.body || '#140d09');
  (p.glow || []).forEach(([x, y, rad, col]) => { ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill(); });
  ctx.shadowBlur = 0;
  g = ctx.createRadialGradient(W / 2, H * .45, H * .28, W / 2, H * .5, H * .78);

function cPage(c) {

        <div><button type="button" class="p-link" data-tradd="1" style="margin-top:4px">+ Add a detail</button></div></fieldset>
      <div class="fld"><label for="f-story">Their story</label><textarea id="f-story" name="story" rows="3" placeholder="As much or as little as you like.">${v('story')}</textarea></div>
      <div class="fld"><span class="lab">Status</span><div><div class="p-seg" role="group" aria-label="Status">
        ${[['active', 'Adventuring'], ['retired', 'Retired'], ['fallen', 'Fallen']].map(([k, l]) => `<button type="button" data-dstatus="${k}" aria-pressed="${d.status === k}">${l}</button>`).join('')}</div></div></div>
      ${d.status === 'fallen' && campPlayed.length ? `<div class="fld"><label for="f-fell">Fell in</label><select id="f-fell" name="fellIn"><option value="">Not saying</option>
        ${campPlayed.map(s => `<option value="${s.id}" ${d.fellIn === s.id ? 'selected' : ''}>${esc(s.title)} · ${shortDate(s.date)}</option>`).join('')}</select></div>` : ''}
    </form>
    <div class="dlg-f"><button type="button" class="p-ghost" data-dlgclose="1">Cancel</button><button type="submit" form="dlg-form" class="hs-btn-amber">${d.id ? 'Save' : 'Add to the roster'}</button></div>
  </div></div>`;
  Hearthside.GildedPanel.decorate(el);
}
function saveDraft() {
  const d = draft;
  if (!d.name.trim()) { toast('Prototype: a name is the one thing every adventurer needs.'); document.getElementById('f-name')?.focus(); return; }
  const level = d.level === '' || d.level == null ? null : Number(d.level);
  const clean = { ...d, name: d.name.trim(), level, camp: d.camp || null, traits: d.traits.filter(([k, v]) => k.trim() || v.trim()), fellIn: d.status === 'fallen' ? d.fellIn || null : null };
  if (d.id) {
    const c = CHARS.find(x => x.id === d.id);
    if (c.level !== level && level != null) c.levels.push([null, level]);   // a level change would be dated in the real thing
    Object.assign(c, clean, { levels: c.levels });
  } else {
    const id = 'new' + Date.now();
    CHARS.unshift({ ...clean, id, made: new Date(TODAY), played: [], levels: level != null ? [[null, level]] : [] });
    empty = false; store.set('hs-adv-data', 'full');
    sel = id;
  }
  draft = null; renderDlg(); aArt = 0; render();
  toast('Prototype: saved in memory only.');
}
const readImage = (file, done) => { const fr = new FileReader(); fr.onload = () => done(fr.result); fr.readAsDataURL(file); };

/* ---------------- the rail's Your Quests (shell) ---------------- */
function renderRail() {
  const qs = QUESTS.slice().sort((a, b) => (a.due ? +a.due : Infinity) - (b.due ? +b.due : Infinity));
  document.getElementById('qc').textContent = `${qs.filter(q => q.status === 'open').length} open`;
  const el = document.getElementById('rail-quests');
  el.innerHTML = `<ul class="hs-quests">${qs.map(q => `<li class="${q.status === 'done' ? 'is-done' : ''}">${box(q)}
      <div><div class="hs-quest-name">${esc(q.title)}${q.tag ? `<span class="hs-tag">${esc(q.tag)}</span>` : ''}</div><div class="hs-quest-time">${q.due ? `${dayLabel(q.due)}, ${tm(q.due)}` : 'No due time'}</div>
        <div class="hs-quest-for">For ${esc(q.for)}</div></div></li>`).join('')}</ul>`;
  Hearthside.GildedPanel.decorate(el.parentNode);
}

/* ---------------- render + wiring ---------------- */
const page = document.getElementById('page');
const RENDER = [VariantA, VariantB, VariantC];
function render() {
  if (sel && !C(sel)) sel = null;
  page.innerHTML = RENDER[variant]();
  Hearthside.GildedPanel.decorate(page);
  page.querySelectorAll('.hs-sheet').forEach(el => Hearthside.NoticeSheet.mount(el));
  renderRail();
  const v = VARIANTS[variant];
  document.getElementById('lbl').innerHTML = `${v.key} — ${v.name}<small>${v.note}</small>`;
  document.getElementById('data').textContent = empty ? 'Data: no adventurers yet' : "Data: Geoff's adventurers";
  store.set('hs-adv-variant', v.key);
  try { const u = new URL(location.href); u.searchParams.set('variant', v.key); sel ? u.searchParams.set('adventurer', sel) : u.searchParams.delete('adventurer'); history.replaceState(null, '', u); } catch {}
}
const goTo = id => { sel = id; aArt = 0; render(); scrollTo({ top: 0 }); };
function go(d) { variant = (variant + d + VARIANTS.length) % VARIANTS.length; render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('data').onclick = () => { empty = !empty; store.set('hs-adv-data', empty ? 'empty' : 'full'); sel = null; render(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape' && draft) { draft = null; renderDlg(); return; }
  if (draft || e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1);
});

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2800); }

document.addEventListener('click', e => {
  if (e.target.matches('.dlg-back')) { draft = null; renderDlg(); return; }   // a click on the dimmed floor closes the editor
  const el = e.target.closest('[data-q],[data-sel],[data-pick],[data-back],[data-home],[data-new],[data-edit],[data-art],[data-mkpt],[data-zoom],[data-btab],[data-camp],[data-mate],[data-session],[data-ext],[data-stub],[data-dlgclose],[data-dstatus],[data-tradd],[data-trdel]');
  if (!el) return;
  e.preventDefault();
  const d = el.dataset;
  if (d.q) { const q = QUESTS.find(x => x.id === d.q); q.status = q.status === 'done' ? 'open' : 'done'; render(); }
  else if (d.sel) goTo(d.sel);
  else if (d.pick) { sel = d.pick; render(); }
  else if (d.back || d.home) goTo(null);
  else if (d.new) openEditor(null);
  else if (d.edit) openEditor(d.edit);
  else if (d.art) { aArt = +d.art; render(); }
  else if (d.mkpt) { const c = C(sel), [a] = c.art.splice(aArt, 1), [cap] = c.artCaps.splice(aArt, 1); c.art.unshift(a); c.artCaps.unshift(cap); aArt = 0; render(); }
  else if (d.zoom) { if (variant === 2 || variant === 1) { variant = 0; aArt = +d.zoom; sel = sel || C(page.querySelector('[data-edit]').dataset.edit).id; render(); toast('Prototype: opened in layout A, which shows art large.'); } }
  else if (d.btab) { bTab = d.btab; sel = null; render(); }
  else if (d.camp) toast(`Prototype: this opens ${CAMPS[d.camp].title}'s page.`);
  else if (d.mate) { const [k, i] = d.mate.split('/'); const m = PARTY[k][+i]; toast(`Prototype: this opens ${m.name}, ${m.player}'s adventurer (read only).`); }
  else if (d.session) toast(`Prototype: this opens ${S(d.session).title}'s recap.`);
  else if (d.ext) toast(`Prototype: this opens ${C(d.ext).link} in a new tab.`);
  else if (d.stub) toast(`Prototype: this goes to ${d.stub}.`);
  else if (d.dlgclose) { draft = null; renderDlg(); }
  else if (d.dstatus) { draft.status = d.dstatus; renderDlg(); }
  else if (d.tradd) { draft.traits.push(['', '']); renderDlg(); document.querySelector(`[data-tk="${draft.traits.length - 1}"]`)?.focus(); }
  else if (d.trdel) { draft.traits.splice(+d.trdel, 1); renderDlg(); }
});
// the editor keeps its working copy as you type; nothing re-renders until a button changes its shape
document.getElementById('dlg').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.tk) draft.traits[+t.dataset.tk][0] = t.value;
  else if (t.dataset.tv) draft.traits[+t.dataset.tv][1] = t.value;
  else if (t.name && t.name in draft || t.name === 'fellIn') { draft[t.name] = t.value; if (t.name === 'name') document.getElementById('dlg-t').textContent = draft.id ? 'Edit ' + (t.value || 'adventurer') : 'A new adventurer'; if (t.name === 'camp') renderDlg(); }
});
document.getElementById('dlg').addEventListener('submit', e => { e.preventDefault(); saveDraft(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-art' && t.files[0]) readImage(t.files[0], url => { draft.art = [addArt(url), ...draft.art]; draft.artCaps = ['Uploaded just now', ...draft.artCaps]; renderDlg(); });
  else if (t.dataset.addart && t.files[0]) readImage(t.files[0], url => { const c = C(t.dataset.addart); c.art.push(addArt(url)); c.artCaps.push('Uploaded just now'); aArt = c.art.length - 1; render(); toast('Prototype: added in memory only.'); });
});

render();
Hearthside.GildedPanel.decorate();
const floor = Hearthside.Floor.mount(document.getElementById('floor'));
if (floor && floor.page) floor.page(3, false);
</script>
