<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthside Profile Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="bundle.css">
<style>
/* PROTOTYPE — throwaway. Three layouts of a player's profile page in the Hearthside design system, switchable from the
   bar at the bottom (or ← →). Keeps every record field the PWA's profile shows (frontend/src/app/profile/page.tsx:
   photo, name, handle, unique ID, internal ID, email, record type, phone, Discord handle and user ID, favourite games,
   characters, campaigns, sessions attended, the Google Calendar integration) and adds: which adventurer played each
   session, notification settings, and Discord beside Google Calendar under Integrations. Data is made up, "today" is
   Tue Oct 27 2026, and everything lives in memory. Only .hs-page changes per layout; the AppShell is the design system's. */
:root{
  color-scheme:dark;
  /* Hearthside tokens (from the design system's tokens.json; one theme, Tavern) */
  --ground:#1a130e;--ground-2:#241a13;--surface:#2c2119;--line:#4a3726;--text:#f1e6d0;--muted:#b8a487;
  --on-wood-text:#fbf1dc;--on-wood-muted:#d4c2a2;--accent:#e5a13a;--accent-ink:#1a130e;--seal:#b4462c;--moss:#7c9a55;
  --verdigris:#5aa396;--paper:#eadbb9;--paper-hi:#f0e3c4;--paper-lo:#e2cea5;--paper-ink:#2b1d12;--paper-muted:#6b5337;
  --paper-line:#c9b28a;--leather-hi:#37281c;--leather:#221810;--gold-hi:#f6dd96;--gold:#d6a84e;--gold-lo:#8a5c1c;
  --gold-line:rgba(226,184,98,0.38);--gold-rule:rgba(226,184,98,0.14);
  --heat-0:rgba(43,29,18,0.06);--heat-1:#d8c092;--heat-2:#c49a5c;--heat-3:#9c6c32;--heat-4:#5a3a1a;--firelight:#ffb36b;
  --font-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --font-story:"IM Fell English",Georgia,serif;
  --font-body:"Alegreya Sans",system-ui,sans-serif;
  --font-label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--sheet-foot:44px;
  --radius-sheet:3px;--radius:4px;--radius-panel:5px;--radius-full:999px;
  --shadow-panel:0 14px 30px rgba(0,0,0,0.55),0 2px 4px rgba(0,0,0,0.5);
  --shadow-panel-inset:inset 0 0 0 1px rgba(0,0,0,0.55),inset 0 0 26px rgba(0,0,0,0.5);
  --shadow-paper:0 16px 34px rgba(0,0,0,0.6),0 2px 4px rgba(0,0,0,0.45);
  --shadow-pin:0 2px 3px rgba(0,0,0,0.5);
  --on-wood-shadow:0 1px 2px rgba(0,0,0,0.9),0 0 14px rgba(0,0,0,0.6);
  --gild:linear-gradient(135deg,#f6dd96 0%,#b07c2c 22%,#f0cf7a 45%,#7c5318 68%,#e7c06a 88%,#a87228 100%);
  --torch:#f07b2c;
  /* the prototype switcher only: deliberately not Hearthside */
  --proto-bg:#fafafa;--proto-fg:#111;--proto-dim:#555;
}
body{margin:0;background:var(--ground);color:var(--text)}
.hs-shell-wrap{padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hs-nav a{cursor:pointer}
.hs-page > *{align-self:stretch;min-width:0}
.hs-app select,.hs-app textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- material context: shared pieces read these, so they sit on parchment or leather alike ---------- */
.hs-sheet{--k-ink:var(--paper-ink);--k-muted:var(--paper-muted);--k-line:var(--paper-line);--k-hi:var(--seal);--k-pri:var(--paper-ink);--k-pri-ink:var(--paper);--k-ok:#4d6a2c}
.hs-gilded{--k-ink:var(--text);--k-muted:var(--muted);--k-line:var(--gold-rule);--k-hi:var(--accent);--k-pri:var(--accent);--k-pri-ink:var(--accent-ink);--k-ok:var(--moss)}

/* ---------- shared bits ---------- */
.p-link{background:none;border:0;padding:0;color:var(--k-hi,var(--accent));cursor:pointer;font-family:var(--font-label);font-size:13.5px;font-weight:500;letter-spacing:.04em;text-decoration:none}
.p-link:hover{text-decoration:underline}
.ext::after{content:" ↗";font-family:var(--font-body)}
.k-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gold-line);background:transparent;color:var(--k-ink,var(--text));border-radius:var(--radius);padding:4px 12px;
  font-family:var(--font-label);font-size:14px;font-weight:500;letter-spacing:.04em;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.4}
.k-btn:hover{border-color:var(--gold)}
.hs-sheet .k-btn{border:1.5px solid var(--paper-ink)}
.k-btn.is-primary{background:var(--k-pri,var(--accent));color:var(--k-pri-ink,var(--accent-ink));border-color:var(--k-pri,var(--accent))}
.k-btn.is-danger{color:#e88a6e;border-color:rgba(232,138,110,.5)}
.k-btn:disabled{opacity:.55;cursor:default}
.k-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.k-h{margin:0 0 8px;font-family:var(--font-label);font-size:13.5px;font-weight:500;letter-spacing:.1em;color:var(--k-muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.k-h .k-aside{font-family:var(--font-body);letter-spacing:0;font-size:13px}
.k-fine{font-size:13px;color:var(--k-muted);line-height:1.45;margin:6px 0 0}
.k-empty{font-size:14.5px;color:var(--k-muted);margin:0;line-height:1.5}
.k-pill{display:inline-block;font-family:var(--font-label);font-size:12px;font-weight:500;letter-spacing:.06em;padding:1px 8px;border-radius:var(--radius-full);border:1px solid currentColor;color:var(--k-muted);white-space:nowrap;vertical-align:1px}
.k-pill.is-ok{color:var(--k-ok)}
.k-pill.is-hi{color:var(--k-hi)}
.k-pill.is-seal{color:#fff;background:var(--seal);border-color:var(--seal)}
.k-pill.is-torch{color:var(--torch)}
.pad{padding:10px 14px}
.rule{border-top:1px solid var(--gold-rule)}
/* a definition list that works on both materials */
.k-dl{margin:0;display:flex;flex-direction:column}
.k-dl > div{display:grid;grid-template-columns:minmax(96px,32%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--k-line);align-items:baseline}
.k-dl > div:first-child{border-top:0}
.k-dl dt{font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--k-muted)}
.k-dl dd{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.k-dl dd small{display:block;color:var(--k-muted);font-size:12.5px}
.k-dl .is-none{color:var(--k-muted);font-style:italic}
.k-dl .lock{font-size:12px;color:var(--k-muted);font-family:var(--font-label);letter-spacing:.05em;margin-left:6px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* portraits: a face in a gilded medallion. Stand-ins are painted by the page; no art = initials on dyed cloth. */
.art{position:absolute;inset:0;background-size:cover;background-position:center}
.pt{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:var(--leather);container-type:inline-size;border-radius:50%}
.pt .art{background-size:170% auto;background-position:50% 45%}
.pt.is-photo .art{background-size:135% auto;background-position:50% 40%}
.pt-none{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 15% 100%,rgba(255,179,107,.2),transparent 55%),linear-gradient(160deg,#4a3324,#1c120b)}
.pt-none span{font-family:var(--font-display);font-size:42cqw;color:var(--gold-hi);opacity:.85;line-height:1}
.pt-none.is-gm{background:radial-gradient(90% 90% at 50% 80%,rgba(240,123,44,.45),transparent 70%),linear-gradient(160deg,#4a2a18,#1c0f08)}
.pt-none.is-gm svg{width:48cqw;height:48cqw;color:var(--torch)}
.medal{position:relative;display:block;flex:none;border-radius:50%;overflow:hidden;border:2px solid transparent;
  background:linear-gradient(var(--leather),var(--leather)) padding-box,var(--gild) border-box;box-shadow:0 3px 8px rgba(0,0,0,.55)}
.medal.is-gm{background:linear-gradient(var(--leather),var(--leather)) padding-box,linear-gradient(135deg,#ffb36b,#a8461a) border-box}
.medal.is-gone .art{filter:grayscale(1) brightness(.75)}
.flame{display:inline-block;width:1em;height:1em;vertical-align:-.12em;color:var(--torch)}
/* the photo: clicking it (yourself) changes it, as on the PWA */
.photo{position:relative;display:block;cursor:default}
.photo.is-mine{cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.photo .ph-hint{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:rgba(10,7,4,.62);opacity:0;transition:opacity .15s;
  font-family:var(--font-label);font-size:13px;letter-spacing:.06em;color:var(--text);text-align:center;line-height:1.2;padding:8px}
.photo.is-mine:hover .ph-hint,.photo.is-mine:focus-within .ph-hint{opacity:1}
.photo:focus-within{outline:2px solid var(--accent);outline-offset:3px;border-radius:50%}

/* banners, as on the Campaigns page */
.bn{position:absolute;inset:0;background-size:cover;background-position:center}
.bn.is-cloth{display:grid;place-items:center end;padding-right:8%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 6px),linear-gradient(160deg,var(--c1),var(--c2))}
.bn.is-cloth::after{content:"";position:absolute;inset:4px;border:1px dashed rgba(246,221,150,.4);border-radius:2px}
.bn.is-cloth span{font-family:var(--font-display);font-size:20px;letter-spacing:.12em;color:var(--gold-hi);opacity:.85;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.thumb{position:relative;display:inline-block;flex:none;width:40px;height:22px;border-radius:2px;overflow:hidden;vertical-align:-6px;box-shadow:0 0 0 1px rgba(0,0,0,.7),0 1px 3px rgba(0,0,0,.6)}
.thumb .bn.is-cloth span{display:none}
.thumb .bn.is-cloth::after{display:none}

/* the head of the page, on the floor */
.pf-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pf-head .photo{width:96px}
.pf-head .who{min-width:0;flex:1 1 220px}
.pf-head h1{margin:0;font-family:var(--font-story);font-weight:400;font-size:clamp(28px,3.4vw,38px);line-height:1.1;color:var(--on-wood-text);text-shadow:var(--on-wood-shadow)}
.pf-head .handle{font-family:var(--font-label);font-size:16px;letter-spacing:.04em;color:var(--accent);text-shadow:var(--on-wood-shadow)}
.pf-head .handle small{color:var(--on-wood-muted);font-family:var(--font-body);letter-spacing:0;font-size:14px}
.pf-head p{margin:4px 0 0;color:var(--on-wood-muted);font-size:14.5px;text-shadow:var(--on-wood-shadow)}
.pf-head .acts{display:flex;gap:8px;flex-wrap:wrap}
.floor-btn{background:rgba(26,19,14,.72);color:var(--text);border:1px solid var(--gold-line);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.floor-btn.is-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* favourite games: chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border:1px solid var(--gold-line);border-radius:var(--radius-full);font-size:13.5px;background:rgba(0,0,0,.18)}
.chip.ro{padding-right:10px}
.chip button{background:none;border:0;color:var(--muted);cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}
.chip button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.add-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-full);padding:3px 10px;color:var(--text);font-size:13.5px;width:150px}
.add-in:focus{outline:0;border-color:var(--gold)}

/* adventurers: medallions with names */
.advs{display:flex;flex-wrap:wrap;gap:12px 14px}
.adv{display:flex;flex-direction:column;align-items:center;gap:4px;width:68px;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:center}
.adv .medal{width:52px}
.adv b{font-weight:500;font-size:12.5px;line-height:1.2}
.adv small{font-size:11.5px;color:var(--k-muted,var(--muted));line-height:1.2}

/* sessions: a row each */
.srs{list-style:none;margin:0;padding:0}
.srs li{border-top:1px solid var(--k-line)}
.srs li:first-child{border-top:0}
.sr{display:grid;grid-template-columns:52px 40px minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:9px 4px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;border-radius:var(--radius)}
.sr:hover{background:rgba(255,214,140,.05)}
.sr .medal{width:40px}
.sr-when{font-family:var(--font-label);font-size:13px;letter-spacing:.04em;color:var(--k-muted);line-height:1.15;font-variant-numeric:tabular-nums}
.sr-when b{display:block;color:var(--k-ink);font-weight:500;font-size:14px}
.sr-t{min-width:0;display:flex;flex-direction:column}
.sr-k{font-family:var(--font-label);font-size:12px;letter-spacing:.08em;color:var(--k-muted)}
.sr-n{font-size:14.5px;font-weight:500;line-height:1.25}
.sr-as{font-size:13px;color:var(--k-muted)}
.sr-as b{font-weight:500;color:var(--k-ink)}
.sr-as .gm{color:var(--torch)}
.sr.is-next .sr-when b{color:var(--accent)}
.sr .lv{font-family:var(--font-label);font-size:11.5px;letter-spacing:.06em;color:var(--k-ok);border:1px solid currentColor;border-radius:var(--radius-full);padding:0 6px;margin-left:4px;white-space:nowrap}
.filt{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--gold-rule)}
.filt button{background:transparent;border:1px solid var(--gold-line);color:var(--muted);border-radius:var(--radius-full);padding:2px 10px;font-family:var(--font-label);font-size:13px;letter-spacing:.04em;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filt button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.filt button .n{font-family:var(--font-body);font-size:12px;opacity:.8}

/* campaigns: banner cards */
.ccs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{position:relative;display:flex;flex-direction:column;text-align:left;color:inherit;cursor:pointer;padding:6px;min-width:0;font:inherit}
.cc:not(.hs-gilded){background:rgba(0,0,0,.16);border:0}
.cc-bn{position:relative;display:block;aspect-ratio:4/1;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.cc.is-done .cc-bn .bn{filter:grayscale(.55) brightness(.8)}
.cc-body{display:flex;flex-direction:column;gap:3px;padding:10px 10px 8px}
.cc-t{font-family:var(--font-story);font-size:19px;line-height:1.15}
.cc-s{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.cc-role{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13.5px}
.cc-role .medal{width:30px}
.cc-role .twin{display:flex}
.cc-role .twin .medal + .medal{margin-left:-10px}
.cc-f{font-size:13px;color:var(--muted);margin-top:2px}
.cc-f b{color:var(--accent);font-weight:500}
.st-live{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-label);font-size:12.5px;letter-spacing:.06em;color:var(--accent)}
.st-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* notification settings: a grid of where each notice goes */
.nt{width:100%;border-collapse:collapse;font-size:14px}
.nt th,.nt td{padding:8px 4px;border-top:1px solid var(--gold-rule);vertical-align:middle}
.nt thead th{border-top:0;font-family:var(--font-label);font-weight:500;font-size:12.5px;letter-spacing:.07em;color:var(--muted);text-align:center;width:58px;line-height:1.15;padding-bottom:6px}
.nt thead th:first-child{width:auto}
.nt thead th small{display:block;font-family:var(--font-body);letter-spacing:0;font-size:11.5px}
.nt tbody th{text-align:left;font-weight:500;padding-left:6px}
.nt tbody th small{display:block;font-weight:400;font-size:12.5px;color:var(--muted);line-height:1.3}
.nt td{text-align:center}
.nt tr.g th{padding-top:14px;border-top:0;font-family:var(--font-label);font-size:13px;letter-spacing:.1em;color:var(--accent);font-weight:500}
.nt tr.sub td{border-top:0;padding-top:0;text-align:left;padding-left:6px}
.ck{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1.5px solid var(--muted);border-radius:3px;background:transparent;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle}
.ck:checked{background:var(--moss);border-color:var(--moss)}
.ck:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.ck:disabled{opacity:.35;cursor:default}
.ck:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.offs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.offs select,.fld select,.ig select,.qh select{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:3px 6px;color:var(--text);font-size:13.5px;max-width:100%}
/* a switch, for a yes/no that changes something right away */
.sw{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14px;line-height:1.35}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:34px;height:20px;margin:0;border-radius:10px;background:var(--surface);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw input:checked{background:var(--moss);border-color:var(--moss)}
.sw input:checked::after{transform:translateX(14px);background:var(--accent-ink)}
.sw input:disabled{opacity:.4}
.sw small{display:block;color:var(--muted);font-size:12.5px}
.qh{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--gold-rule)}
.qh .times{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:44px;font-size:13.5px;color:var(--muted)}

/* integrations: modeled on the PWA's Google Calendar card. Name and a line on the left, one button on the right. */
.igs{display:flex;flex-direction:column}
.ig{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:14px}
.ig + .ig{border-top:1px solid var(--gold-rule)}
.ig-mark{width:40px;height:40px;border-radius:var(--radius);display:grid;place-items:center;border:1px solid var(--gold-line);background:rgba(0,0,0,.25);color:var(--gold-hi)}
.ig-mark svg{width:22px;height:22px}
.ig-name{font-family:var(--font-story);font-size:19px;line-height:1.2;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ig-sub{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.4}
.ig-warn{margin:6px 0 0;font-size:13.5px;line-height:1.4;color:var(--text);padding-left:10px;border-left:2px solid var(--seal)}
.ig-btn{align-self:center;min-width:104px}
.ig-opts{grid-column:2 / -1;display:flex;flex-direction:column;gap:10px;margin-top:8px;padding-top:10px;border-top:1px dashed var(--gold-rule)}
.ig-opts label.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.ig-note{grid-column:2 / -1;margin:4px 0 0;font-size:13px;color:var(--accent)}
@media (max-width:480px){.ig{grid-template-columns:40px minmax(0,1fr)}.ig-btn{grid-column:2;justify-self:start}}

/* ---------- A: The ledger. The PWA's tabs, in gilded leather. ---------- */
.a-tabs{padding:0 6px}
.a-tabs .hs-tabs{border-bottom:0;flex-wrap:wrap}
.a-tabs .hs-tabs button{flex:1 1 auto;padding:10px 8px;font-size:14.5px;white-space:nowrap}
.a-tabs .hs-tabs button small{font-family:var(--font-body);font-size:12px;letter-spacing:0;color:var(--muted);margin-left:4px}
.a-panel{padding:6px}
.a-sec + .a-sec{border-top:1px solid var(--gold-rule)}
.a-sec{padding:12px 12px}
.a-sec .k-h{color:var(--accent)}
.a-ccs{padding:8px}
.a-ccs .ccs{gap:10px}

/* ---------- B: The guest book. One long page, everything showing; sessions as slips of parchment. ---------- */
.b-top{display:grid;grid-template-columns:184px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:620px){.b-top{grid-template-columns:1fr}}
.b-frame{display:flex;flex-direction:column;align-items:center;gap:10px}
.b-frame .photo{width:168px}

.plate{min-width:150px;max-width:100%;padding:6px 14px 7px;text-align:center;border-radius:2px;
  background:linear-gradient(180deg,#e7c06a,#b07c2c 60%,#8a5c1c);box-shadow:0 3px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,240,200,.6);color:#2b1a08}
.plate b{display:block;font-family:var(--font-story);font-weight:400;font-size:20px;line-height:1.1}
.plate small{display:block;font-family:var(--font-label);font-size:13px;letter-spacing:.06em}
.b-frame .k-row{justify-content:center}
.b-rec{padding:6px}
.b-rec .k-dl{padding:6px 12px}
.b-rec .k-dl > div{border-top-style:solid}
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px 16px;padding-top:6px}
.slip.hs-sheet{padding:18px 16px 30px;cursor:pointer;text-align:left;display:block;font:inherit}
.slip .hs-kicker{font-size:12px}
.slip h4{margin:2px 0 0;font-family:var(--font-story);font-weight:400;font-size:18px;line-height:1.15;color:var(--paper-ink)}
.slip .when{font-size:13px;color:var(--paper-muted);margin-top:2px}
.slip .as{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--paper-ink)}
.slip .as .medal{width:34px;transform:rotate(-4deg)}
.slip .as small{display:block;color:var(--paper-muted);font-size:12px}
.slip .as .gm{color:#9a4a12}
.b-all{padding:6px}
.b-two{display:grid;grid-template-columns:1fr;gap:20px}

/* ---------- C: The road, with settings in a room of their own. ---------- */
.c-seg{display:inline-flex;padding:4px;gap:4px;border:1px solid var(--gold-line);border-radius:var(--radius);background:rgba(26,19,14,.72);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.c-seg button{background:transparent;border:0;color:var(--muted);padding:5px 14px;border-radius:3px;font-family:var(--font-label);font-size:14.5px;letter-spacing:.05em;cursor:pointer}
.c-seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.c-hero{position:relative;overflow:hidden;padding:6px}
.c-hero-bg{position:absolute;inset:0;z-index:0;filter:blur(18px) brightness(.45) saturate(1.1);transform:scale(1.2)}
.c-hero-in{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:18px 16px}
.c-hero .photo{width:104px}
.c-hero h2{margin:0;font-family:var(--font-story);font-weight:400;font-size:28px;line-height:1.1}
.c-hero .handle{font-family:var(--font-label);font-size:15px;letter-spacing:.04em;color:var(--accent)}

.c-hero-foot{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;padding:12px 16px 14px;border-top:1px solid var(--gold-rule);background:rgba(20,14,10,.45)}
@media (max-width:560px){.c-hero-foot{grid-template-columns:1fr}.c-hero-in{grid-template-columns:1fr;justify-items:start}}
.c-camps{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.c-camp{flex:0 0 172px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:inherit;padding:6px;font:inherit}
.c-camp .cc-bn{aspect-ratio:3/1}
.c-camp b{font-family:var(--font-story);font-weight:400;font-size:16px;line-height:1.15;padding:0 4px}
.c-camp small{font-size:12.5px;color:var(--muted);padding:0 4px 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.c-camp[aria-pressed="true"]{box-shadow:var(--shadow-panel),0 0 0 2px var(--accent),0 0 18px rgba(229,161,58,.35)}
.road{list-style:none;margin:0;padding:8px 14px 8px 12px;position:relative}
.road::before{content:"";position:absolute;left:calc(12px + 52px + 10px + 19px);top:16px;bottom:16px;width:2px;background:linear-gradient(var(--gold-line),var(--gold-rule))}
.road li{position:relative}
.road .sr{padding:8px 0}
.road .sr .medal{position:relative;z-index:1}
.road .mo{display:block;padding:12px 0 4px calc(52px + 10px + 40px + 10px);font-family:var(--font-label);font-size:13px;letter-spacing:.1em;color:var(--accent)}
.road .mark{display:grid;grid-template-columns:52px 40px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;font-size:13.5px;color:var(--muted);font-style:italic}
.road .mark i{justify-self:center;width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--gold);background:var(--leather);position:relative;z-index:1}
.road .mark.is-fell i{border-color:#8a8a8a;background:#2a2a2a}
.road .mark.is-now{font-style:normal;font-family:var(--font-label);letter-spacing:.06em;color:var(--accent)}

.road li.is-away .sr{opacity:.55}

.road li.is-up .sr-when b{color:var(--accent)}

.c-set{display:flex;flex-direction:column;gap:20px}
.c-form{padding:6px 14px 14px}

/* ---------- fields (Hearthside has no form styles yet; these follow the message composer) ---------- */
.fld{display:flex;flex-direction:column;gap:5px;margin:14px 0 0;min-width:0}
.fld > label,.fld .lab{font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--muted)}

/* ---------- dialogs. Gilded. ---------- */
.dlg-back{position:fixed;inset:0;z-index:60;background:rgba(10,7,4,.74);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}

.dlg-f .k-btn{height:36px;font-size:15px}
.x-btn{background:transparent;border:1px solid var(--line);border-radius:var(--radius);width:32px;height:32px;cursor:pointer;color:var(--text);flex:none}

/* ---------- prototype switcher (not part of any design) ---------- */
.proto-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);
  background:var(--proto-bg);color:var(--proto-fg);border-radius:14px;padding:6px 8px;box-shadow:0 8px 30px rgba(0,0,0,.6);
  font:13px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}

.proto-bar button:hover{background:#dcdcdc}
.proto-bar .lbl{min-width:190px;text-align:center;font-weight:600;padding:0 4px}
.proto-bar .lbl small{display:block;font-weight:400;color:var(--proto-dim);font-size:11px}

.proto-bar :focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.proto-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--proto-bg);color:var(--proto-fg);
  font:13px/1.3 ui-sans-serif,system-ui,sans-serif;padding:8px 12px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){.photo .ph-hint,.sw input,.sw input::after{transition:none}}

<script>
document.body.classList.add('hs-app');

function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function ridge(ctx, r, W, y0, amp, step, color, H = 400) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  let y = y0; for (let x = 0; x <= W + step; x += step) { y = Math.max(y0 - amp, Math.min(y0 + amp, y + (r() - .5) * amp)); ctx.lineTo(x, y); }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function paintBanner(kind) {
  const W = 1600, H = 400, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), r = rng(kind);
  const sky = (stops) => { const g = ctx.createLinearGradient(0, 0, 0, H); stops.forEach(([o, col]) => g.addColorStop(o, col)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
  if (kind === 'ashen') {
    sky([[0, '#2a0f0c'], [.55, '#7a2a14'], [.8, '#d0652a'], [1, '#f2a24a']]);
    for (let i = 0; i < 220; i++) { ctx.fillStyle = `rgba(230,200,180,${r() * .35})`; ctx.fillRect(r() * W, r() * H * .8, 2, 2); }
    ridge(ctx, r, W, 250, 60, 40, '#3a1710');
    ridge(ctx, r, W, 300, 30, 30, '#1c0b08');
    ctx.fillStyle = '#0e0605';
    const kx = 1060; ctx.fillRect(kx, 170, 160, 140);
    [[kx - 30, 140, 40, 170], [kx + 60, 110, 40, 200], [kx + 150, 140, 40, 170]].forEach(([x, y, w, h]) => {
      ctx.fillRect(x, y, w, h); for (let i = 0; i < 3; i++) ctx.fillRect(x + i * 15, y - 12, 9, 12);
    });
    ctx.fillStyle = 'rgba(255,170,80,.8)'; [[kx + 76, 140], [kx + 20, 210], [kx + 120, 230]].forEach(([x, y]) => ctx.fillRect(x, y, 6, 10));
    ridge(ctx, r, W, 360, 14, 24, '#070303');
  } else if (kind === 'starfall') {
    sky([[0, '#060a1c'], [.6, '#13294a'], [1, '#2f6a74']]);
    for (let i = 0; i < 380; i++) { const s = r(); ctx.fillStyle = `rgba(255,255,240,${.3 + s * .7})`; ctx.fillRect(r() * W, r() * H * .75, s > .93 ? 3 : 1.5, s > .93 ? 3 : 1.5); }
    const g = ctx.createLinearGradient(300, 40, 760, 220); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,236,190,.95)');
    ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(300, 40); ctx.lineTo(760, 220); ctx.stroke();
    ctx.fillStyle = '#fff6d8'; ctx.beginPath(); ctx.arc(762, 221, 6, 0, 7); ctx.fill();
    ridge(ctx, r, W, 300, 26, 60, '#3a3550');
    ctx.fillStyle = '#16142a'; ctx.beginPath();
    ctx.moveTo(380, 330); ctx.quadraticCurveTo(520, 200, 720, 300); ctx.lineTo(700, 330); ctx.closePath(); ctx.fill();
    for (let i = 0; i < 6; i++) { ctx.fillRect(430 + i * 45, 250 - Math.sin(i / 5 * Math.PI) * 30, 7, 90); }
    ridge(ctx, r, W, 350, 18, 50, '#0b0a18');
  } else if (kind === 'lantern') {   // a road at dusk, lanterns along it
    sky([[0, '#15122a'], [.5, '#3b2a4a'], [.82, '#a0553a'], [1, '#e3954c']]);
    for (let i = 0; i < 90; i++) { ctx.fillStyle = `rgba(255,240,220,${r() * .6})`; ctx.fillRect(r() * W, r() * H * .45, 1.5, 1.5); }
    ridge(ctx, r, W, 250, 50, 50, '#2c1f2e');
    ridge(ctx, r, W, 305, 26, 36, '#180f19');
    ctx.fillStyle = 'rgba(236,180,110,.32)'; ctx.beginPath();
    ctx.moveTo(560, 400); ctx.quadraticCurveTo(760, 330, 980, 300); ctx.lineTo(1000, 300); ctx.quadraticCurveTo(820, 340, 760, 400); ctx.closePath(); ctx.fill();
    ctx.shadowColor = '#ffb36b'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffd08a';
    [[640, 372], [730, 345], [810, 326], [880, 313], [940, 305], [985, 300]].forEach(([x, y], i) => { ctx.beginPath(); ctx.arc(x, y - 8, 5 - i * .6, 0, 7); ctx.fill(); });
    ctx.shadowBlur = 0;
  }
  return c.toDataURL('image/jpeg', .85);
}

/* A portrait stand-in: a silhouette against a painted backdrop, rim-lit from the left (where the hearth is), with
   a few glints. What an uploaded commission, sketch or token would sit in. p: bg, body, rim, gear, motif, glow. */
function paintPortrait(p) {
  const W = 480, H = 640, c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'), r = rng(p.seed);
  let g = ctx.createRadialGradient(W * .38, H * .32, 20, W * .5, H * .5, H * .8);
  g.addColorStop(0, p.bg[0]); g.addColorStop(1, p.bg[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  motif(ctx, r, p.motif, W, H);
  figure(ctx, p, -7, -2, p.rim || '#ffb36b');
  figure(ctx, p, 0, 0, p.body || '#140d09');
  (p.glow || []).forEach(([x, y, rad, col]) => { ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill(); });
  ctx.shadowBlur = 0;
  g = ctx.createRadialGradient(W / 2, H * .45, H * .28, W / 2, H * .5, H * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  return c.toDataURL('image/jpeg', .86);
}
function motif(ctx, r, kind, W, H) {
  if (kind === 'stars') for (let i = 0; i < 170; i++) { const s = r(); ctx.fillStyle = `rgba(255,255,240,${.25 + s * .7})`; ctx.fillRect(r() * W, r() * H * .8, s > .92 ? 3 : 1.5, s > .92 ? 3 : 1.5); }
  if (kind === 'waves') { ctx.lineWidth = 2; for (let k = 0; k < 9; k++) { ctx.strokeStyle = `rgba(150,215,205,${.12 + r() * .14})`; ctx.beginPath(); const y0 = H * .45 + k * 30, ph = r() * 6;
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, y0 + Math.sin(x / 38 + ph) * 8); ctx.stroke(); } }
  if (kind === 'embers') for (let i = 0; i < 90; i++) { const y = H * (1 - Math.pow(r(), 1.6)); ctx.fillStyle = `rgba(255,${120 + r() * 80 | 0},50,${r() * .8})`; ctx.beginPath(); ctx.arc(r() * W, y, 1 + r() * 2.5, 0, 7); ctx.fill(); }
  if (kind === 'leaves') for (let i = 0; i < 46; i++) { ctx.save(); ctx.translate(r() * W, r() * H); ctx.rotate(r() * 6); ctx.fillStyle = `rgba(${120 + r() * 70 | 0},${110 + r() * 50 | 0},50,${.25 + r() * .3})`; ctx.beginPath(); ctx.ellipse(0, 0, 9, 4, 0, 0, 7); ctx.fill(); ctx.restore(); }
  if (kind === 'rain') { ctx.lineWidth = 1.2; for (let i = 0; i < 150; i++) { const x = r() * W, y = r() * H; ctx.strokeStyle = `rgba(200,212,235,${.08 + r() * .16})`; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 9, y + 26); ctx.stroke(); } }
  if (kind === 'mist') for (let i = 0; i < 14; i++) { const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 120); g.addColorStop(0, 'rgba(220,210,255,.12)'); g.addColorStop(1, 'rgba(220,210,255,0)');
    ctx.save(); ctx.translate(r() * W, H * .3 + r() * H * .7); ctx.fillStyle = g; ctx.fillRect(-120, -120, 240, 240); ctx.restore(); }
}
function figure(ctx, p, dx, dy, col) {
  const cx = 240; ctx.save(); ctx.translate(dx, dy); ctx.fillStyle = col;
  const gear = p.gear || '';
  if (gear.includes('long')) { ctx.beginPath(); ctx.ellipse(cx, 360, 118, 175, 0, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(cx, 730, 228, 260, 0, Math.PI, 0); ctx.fill();                       // shoulders
  ctx.fillRect(cx - 34, 380, 68, 120);                                                            // neck
  ctx.beginPath(); ctx.ellipse(cx, 300, 82, 104, 0, 0, 7); ctx.fill();                           // head
  if (gear.includes('ears')) [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(cx + s * 92, 200, 46, 56, s * .4, 0, 7); ctx.fill(); });
  if (gear.includes('hood')) { ctx.beginPath(); ctx.moveTo(cx - 160, 540); ctx.quadraticCurveTo(cx - 150, 220, cx, 150); ctx.quadraticCurveTo(cx + 150, 220, cx + 160, 540); ctx.closePath(); ctx.fill(); }
  if (gear.includes('helm')) {
    ctx.fillRect(cx - 92, 226, 184, 110);

        <div class="k-row"><button type="button" class="k-btn" data-rec-reset ${dirty ? '' : 'disabled'}>Undo changes</button><button class="k-btn is-primary" ${dirty ? '' : 'disabled'}>Save</button></div></form>
      <p class="hs-note" style="margin-top:10px">Your party sees your name, handle, photo, Discord name and favourite games. Email and phone are only shown to you.</p></section>
    <section><h2 class="hs-sec"><span>Notices</span><span class="hs-aside">where each reaches you</span></h2><div class="hs-gilded" style="padding-top:8px">${noticesHTML()}</div></section>
    <section id="c-ig"><h2 class="hs-sec"><span>Integrations</span><span class="hs-aside">${[cur.gcal, cur.discord].filter(x => x.connected).length} of 2 connected</span></h2><div class="hs-gilded">${integrationsHTML()}</div></section>
    <p class="hs-note">Your free evenings are set in the Almanac. The API key vault stays on the main site.</p></div>`;
}

/* ---------------- the record's fields (A and B in a dialog, C in place) ---------------- */
function recFields(d) {
  const dc = cur.discord.connected;
  return `<div class="fld"><label for="f-name">Name</label><input id="f-name" name="name" value="${esc(d.name)}" required></div>
    <div class="fld-2"><div class="fld"><label for="f-handle">Handle</label><div class="at"><span>@</span><input id="f-handle" name="handle" value="${esc(d.handle)}" placeholder="yourhandle" autocomplete="off"></div>
      <small>Your unique ID is your handle plus #${esc(R().userNumber)}.</small></div>
      <div class="fld"><label for="f-phone">Phone</label><input id="f-phone" name="phone" value="${esc(d.phone)}" inputmode="tel"></div></div>
    <div class="fld"><label for="f-email">Email</label><input id="f-email" value="${esc(R().email)}" disabled><small>Email can't be changed here.</small></div>
    <div class="fld-2"><div class="fld"><label for="f-dh">Discord name${dc ? '<span class="from">from Discord</span>' : ''}</label><input id="f-dh" name="discordHandle" value="${esc(d.discordHandle)}" placeholder="username" ${dc ? 'disabled' : ''}></div>
      <div class="fld"><label for="f-di">Discord user ID${dc ? '<span class="from">from Discord</span>' : ''}</label><input id="f-di" name="discordId" value="${esc(d.discordId)}" placeholder="123456789012345678" inputmode="numeric" ${dc ? 'disabled' : ''}></div></div>
    <small class="k-fine" style="display:block">${dc ? 'Disconnect Discord under Integrations to type these yourself.' : 'Connecting Discord under Integrations fills these in. To find your ID by hand: Settings › Advanced › Developer Mode on, then right-click your profile › Copy User ID.'}</small>`;
}
function renderOv() {
  const el = document.getElementById('ov');
  if (!ov) { el.hidden = true; el.innerHTML = ''; return; }
  const r = R();
  el.hidden = false;
  el.innerHTML = `<div class="dlg-back" data-ovclose><form class="hs-gilded dlg" id="rec-form" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
    <div class="dlg-h"><h2 id="dlg-t">Your record</h2><button type="button" class="x-btn" data-ovclose aria-label="Close">×</button></div>
    <div class="dlg-body">${recFields({ name: r.name, handle: r.handle, phone: r.phone, discordHandle: r.discordHandle, discordId: r.discordId })}</div>
    <div class="dlg-f"><button type="button" class="k-btn" data-ovclose>Cancel</button><button class="k-btn is-primary">Save changes</button></div></form></div>`;
  Hearthside.GildedPanel.decorate(el);
  el.querySelector('#f-name').focus();
}

/* ---------------- rail and nav ---------------- */
function renderRail() {
  const qs = cur.fresh && self() ? [] : RAIL[viewer];
  document.getElementById('qc').textContent = `${qs.length} open`;
  const el = document.getElementById('rail-quests');
  el.innerHTML = !qs.length ? '<p class="k-empty pad">No quests yet.</p>' : `<ul class="hs-quests">${qs.map(q => `<li><span class="hs-box" aria-hidden="true"></span>
      <div><div class="hs-quest-name">${esc(q.title)}${q.tag ? `<span class="hs-tag">${esc(q.tag)}</span>` : ''}</div><div class="hs-quest-time">${dayLabel(q.due)}, ${tm(q.due)}</div>
        <div class="hs-quest-desc">For ${esc(q.for)}</div></div></li>`).join('')}</ul>`;
  const nav = document.getElementById('nav');
  // the profile is "Your room" in the nav: a tavern name for your own place, as the design system names its places
  nav.innerHTML = ['The Hearth', 'Campaigns', 'Almanac', 'Adventurers', 'Your Room'].map(n => `<a ${n === 'Your Room' && self() ? 'aria-current="page"' : ''} data-stub="${n}">${n}</a>`).join('');
  Hearthside.GildedPanel.decorate(document.querySelector('.hs-rail'));
}

/* ---------------- render + wiring ---------------- */
const page = document.getElementById('page');
const RENDER = [VariantA, VariantB, VariantC];
function render() {
  const keep = document.activeElement?.id;
  page.innerHTML = RENDER[variant]();
  Hearthside.GildedPanel.decorate(page);
  page.querySelectorAll('.hs-sheet').forEach(el => Hearthside.NoticeSheet.mount(el));
  renderRail();
  const v = VARIANTS[variant], st = STATES[stateI];
  document.getElementById('lbl').innerHTML = `${v.key} — ${v.name}<small>${v.note}</small>`;
  document.getElementById('state').innerHTML = `State: ${st.name}<small>${st.note}</small>`;
  document.getElementById('who').textContent = { geoff: 'As Geoff (yourself)', avery: 'As Avery, a campaign-mate', sam: 'As Sam, a friend (no campaigns shared)' }[viewer];
  store.set('hs-prof-variant', v.key); store.set('hs-prof-state', st.key); store.set('hs-prof-as', viewer);
  try { const u = new URL(location.href); u.searchParams.set('variant', v.key); u.searchParams.set('state', st.key); u.searchParams.set('as', viewer); history.replaceState(null, '', u); } catch {}
  if (keep) document.getElementById(keep)?.focus();
}
function reset() { sFilter = 'all'; showAll = false; pending = null; notice = {}; recDraft = null; ov = null; renderOv(); cur = STATES[stateI].make(); }
function go(d) { variant = (variant + d + VARIANTS.length) % VARIANTS.length; recDraft = null; render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('state').onclick = () => { stateI = (stateI + 1) % STATES.length; reset(); render(); };
document.getElementById('who').onclick = () => { viewer = VIEWERS[(VIEWERS.indexOf(viewer) + 1) % VIEWERS.length]; sFilter = 'all'; showAll = false; recDraft = null; render(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape' && ov) { ov = null; renderOv(); return; }
  if (ov || e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1);
});
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }

// connecting goes to the service's own sign-in page and comes back with ?gcal=connected (or denied), as the PWA does
function connect(kind) {
  pending = kind; notice[kind] = ''; render();
  setTimeout(() => {
    pending = null;
    if (kind === 'gcal') { cur.gcal.connected = true; const re = cur.gcal.needsReconsent; cur.gcal.needsReconsent = false; cur.gcal.busy = true; notice.gcal = re ? 'Reconnected. Your busy time now counts when the party plans a night.' : 'Google Calendar connected!'; }
    else { cur.discord.connected = true; cur.discord.dms = true; R().discordHandle = DISCORD.handle; R().discordId = DISCORD.id; recDraft = null; notice.discord = 'Discord connected! Your Discord name and user ID are filled in.'; }
    render(); toast(`Prototype: the real button leaves for ${kind === 'gcal' ? "Google's" : "Discord's"} sign-in page and comes back here.`);
  }, 1100);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,a,[data-ovclose]'); if (!t) return;
  const d = t.dataset;
  if (d.ovclose != null && (t.tagName === 'BUTTON' || e.target === t)) { ov = null; renderOv(); return; }
  if (d.stub) { toast(`Prototype: this opens ${d.stub}.`); return; }
  if (d.atab) { aTab = d.atab; render(); document.querySelector(`[data-atab="${aTab}"]`)?.focus(); }
  else if (d.sf) { sFilter = d.sf; render(); }
  else if (d.more != null) { showAll = !showAll; render(); }
  else if (d.edit != null) { ov = { kind: 'edit' }; renderOv(); }
  else if (d.cview) { cView = d.cview; recDraft = null; render(); scrollTo({ top: 0 }); }
  else if (d.igOn) connect(d.igOn);
  else if (d.igOff) {
    const k = d.igOff;
    if (k === 'gcal') { cur.gcal.connected = false; cur.gcal.needsReconsent = false; notice.gcal = 'Disconnected. Sessions already on your calendar stay there.'; }
    else { cur.discord.connected = false; notice.discord = 'Disconnected. Your Discord name stays on your record until you change it.'; }
    render();
  }
  else if (d.goIg != null) {
    if (variant === 0) { aTab = 'integrations'; render(); }
    else if (variant === 2) document.getElementById('c-ig')?.scrollIntoView({ behavior: 'smooth' });
    else page.querySelector('.igs')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  else if (d.gameDel) { R().games = R().games.filter(g => g !== d.gameDel); render(); }
  else if (d.offDel) { cur.prefs.offsets = cur.prefs.offsets.filter(m => m !== +d.offDel); render(); }
  else if (d.recReset != null) { recDraft = null; render(); }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.np) { const [id, ch] = d.np.split(':'); cur.prefs.p[id][ch] = t.checked; }
  else if (d.offAdd != null && t.value) { cur.prefs.offsets.push(+t.value); render(); }
  else if (d.quiet) { if (d.quiet === 'on') { cur.prefs.quiet.on = t.checked; render(); } else cur.prefs.quiet[d.quiet] = t.value; }
  else if (d.opt) { const [k, f] = d.opt.split('.'); cur[k][f] = t.type === 'checkbox' ? t.checked : t.value; if (f === 'dms') render(); }
  else if (d.photo != null && t.files[0]) {
    const f = t.files[0];
    if (!/^image\/(png|jpeg|gif|webp)$/.test(f.type) || f.size > 5e6) { toast('A photo must be a JPG, PNG, GIF or WEBP, up to 5 MB.'); return; }
    R().photo = addArt(URL.createObjectURL(f)); render(); toast('Prototype: your photo is kept in memory only.');
  }
});
document.addEventListener('input', e => {
  if (!recDraft || !e.target.closest('#rec-inline') || !e.target.name) return;
  recDraft[e.target.name] = e.target.name === 'handle' ? e.target.value.replace(/^@/, '') : e.target.value;
  const r = R(), dirty = ['name', 'handle', 'phone', 'discordHandle', 'discordId'].some(k => (recDraft[k] || '') !== (r[k] || ''));
  document.querySelectorAll('#rec-inline .k-row button').forEach(b => b.disabled = !dirty);
});
document.addEventListener('keydown', e => {
  if (e.target.id !== 'game-in' || e.key !== 'Enter') return;
  e.preventDefault(); const v = e.target.value.trim();
  if (v && !R().games.includes(v)) R().games.push(v);
  render(); document.getElementById('game-in')?.focus();
});
document.addEventListener('submit', e => {
  const f = e.target; if (f.id !== 'rec-form' && f.id !== 'rec-inline') return;
  e.preventDefault();
  const fd = new FormData(f), r = R();
  ['name', 'handle', 'phone', 'discordHandle', 'discordId'].forEach(k => { if (fd.has(k)) r[k] = String(fd.get(k)).trim().replace(k === 'handle' ? /^@/ : /^$/, ''); });
  ov = null; recDraft = null; renderOv(); render(); toast('Saved (in memory).');
});

render();
Hearthside.GildedPanel.decorate();
const floor = Hearthside.Floor.mount(document.getElementById('floor'));
if (floor && floor.page) floor.page(4, false);
</script>
