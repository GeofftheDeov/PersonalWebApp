# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to the "main" branch.
#
# To use this workflow, you will need to complete the following set-up steps:
#
# 1. Create an ECR repository to store your images.
#    For example: `aws ecr create-repository --repository-name my-ecr-repo --region us-east-2`.
#    Replace the value of the `ECR_REPOSITORY` environment variable in the workflow below with your repository's name.
#    Replace the value of the `AWS_REGION` environment variable in the workflow below with your repository's region.
#
# 2. Create an ECS task definition, an ECS cluster, and an ECS service.
#    For example, follow the Getting Started guide on the ECS console:
#      https://us-east-2.console.aws.amazon.com/ecs/home?region=us-east-2#/firstRun
#    Replace the value of the `ECS_SERVICE` environment variable in the workflow below with the name you set for the Amazon ECS service.
#    Replace the value of the `ECS_CLUSTER` environment variable in the workflow below with the name you set for the cluster.
#
# 3. Store your ECS task definition as a JSON file in your repository.
#    The format should follow the output of `aws ecs register-task-definition --generate-cli-skeleton`.
#    Replace the value of the `ECS_TASK_DEFINITION` environment variable in the workflow below with the path to the JSON file.
#    Replace the value of the `CONTAINER_NAME` environment variable in the workflow below with the name of the container
#    in the `containerDefinitions` section of the task definition.
#
# 4. Store an IAM user access key in GitHub Actions secrets named `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
#    See the documentation for each action used below for the recommended IAM policies for this IAM user,
#    and best practices on handling the access key credentials.

name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-2                   # set this to your preferred AWS region, e.g. us-west-1
  ECR_BACKEND_REPOSITORY: personal-web-app-backend # set this to your Amazon ECR repository name
  ECR_FRONTEND_REPOSITORY: personal-web-app-frontend # set this to your Amazon ECR repository name
  ECS_SERVICE: personal-web-app-task-definition-service-4t236x8c                 # set this to your Amazon ECS service name
  ECS_CLUSTER: artistic-hippopotamus-hw7oq2                 # set this to your Amazon ECS cluster name
  ECS_TASK_DEFINITION: .aws/backend-task-definition.json  # set this to the path to your Amazon ECS task definition
                                               # file, e.g. .aws/task-definition.json
  CONTAINER_BACKEND: backend                   # set this to the backend container name
  CONTAINER_FRONTEND: frontend                 # set this to the frontend container name

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Register Redis task definition
      id: register-redis
      run: |
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://.aws/redis-task-definition.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        echo "arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

    - name: Deploy prod Redis ECS service
      run: |
        TASK_DEF_ARN="${{ steps.register-redis.outputs.arn }}"
        SERVICE_STATUS=$(aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services redis-prod-service \
          --query 'services[0].status' \
          --output text 2>/dev/null || echo "MISSING")

        if [ "$SERVICE_STATUS" = "ACTIVE" ]; then
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service redis-prod-service \
            --task-definition "$TASK_DEF_ARN" \
            --no-cli-pager
        else
          # First-time creation: wire Cloud Map discovery as redis.pwa.internal
          NAMESPACE_ID=$(aws servicediscovery list-namespaces \
            --query "Namespaces[?Name=='pwa.internal'].Id | [0]" \
            --output text)

          SD_SERVICE_ARN=$(aws servicediscovery list-services \
            --filters "Name=NAMESPACE_ID,Values=$NAMESPACE_ID,Condition=EQ" \
            --query "Services[?Name=='redis'].Arn | [0]" \
            --output text)

          if [ -z "$SD_SERVICE_ARN" ] || [ "$SD_SERVICE_ARN" = "None" ]; then
            SD_SERVICE_ARN=$(aws servicediscovery create-service \
              --name redis \
              --namespace-id "$NAMESPACE_ID" \
              --dns-config "NamespaceId=$NAMESPACE_ID,RoutingPolicy=WEIGHTED,DnsRecords=[{Type=A,TTL=10}]" \
              --query 'Service.Arn' \
              --output text)
          fi

          aws ecs create-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name redis-prod-service \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[subnet-0c33b8b801beec11a,subnet-007a79d52272fe680,subnet-0bbcf124b53fd8f43],securityGroups=[sg-018f4b475a22317f4],assignPublicIp=ENABLED}" \
            --service-registries "registryArn=$SD_SERVICE_ARN" \
            --no-cli-pager
        fi

    - name: Build, tag, and push backend image to Amazon ECR
      id: build-backend-image
      timeout-minutes: 45
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd backend
        docker buildx build --platform linux/arm64 \
          --cache-from type=gha,scope=backend \
          --cache-to type=gha,mode=max,scope=backend \
          --provenance=false \
          -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:prod \
          --push .
        echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push frontend image to Amazon ECR
      id: build-frontend-image
      timeout-minutes: 45
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd frontend
        docker buildx build --platform linux/arm64 \
          --cache-from type=gha,scope=frontend \
          --cache-to type=gha,mode=max,scope=frontend \
          --provenance=false \
          -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:prod \
          --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
          --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
          --push .
        echo "image=$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fill in the new backend image ID in the Amazon ECS task definition
      id: backend-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_BACKEND }}
        image: ${{ steps.build-backend-image.outputs.image }}
        # NOTE: ANTHROPIC_API_KEY, ALPACA_API_KEY, ALPACA_SECRET_KEY are now injected
        # via the task-def `secrets` block (AWS Secrets Manager), not as plaintext env.
        # Do not re-add them here — doing so re-exposes them as plaintext task-def env.
        environment-variables: |
          SYNC_API_KEY=${{ secrets.SYNC_API_KEY }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          SF_PASSWORD=${{ secrets.SF_PASSWORD }}
          SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}
          SF_PRIVATE_KEY_CONTENT=${{ secrets.SF_PRIVATE_KEY_CONTENT }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          VAULT_TOKEN=${{ secrets.VAULT_TOKEN }}

    - name: Fill in the new frontend image ID in the Amazon ECS task definition
      id: frontend-task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
        container-name: ${{ env.CONTAINER_FRONTEND }}
        image: ${{ steps.build-frontend-image.outputs.image }}        

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

  rebase-dev:
    name: Rebase Dev onto Main
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Rebase Dev Branch
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git checkout dev
        git rebase main
        git push origin dev --force

    # NOTE: the Mongo-era "Trigger Data Refresh Task" step (scripts/db-refresh.js
    # against prod/dev MongoDB containers) was retired 2026-08-14 — both
    # environments' MongoDB containers are gone since the Neon Postgres
    # migration. Dev data refresh from prod, if reintroduced, should use Neon
    # branching instead.
