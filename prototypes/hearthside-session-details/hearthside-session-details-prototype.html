<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthside Session Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<link rel="stylesheet" href="bundle.css">
<style>
/* PROTOTYPE — throwaway. Three layouts of a session's own page in the Hearthside design system, switchable from the
   bar at the bottom (or ← →). Keeps what the PWA's session page has (frontend/src/app/game-night/sessions/[id]/page.tsx:
   when and where, the torch, the ready check, prep notes, the summary, quests, attendance, calendar events, the
   recording, edit) and adds: which adventurers were there, room for the tale (the summary), accounts anyone in the party
   uploads, and a slot for an AI-painted reel of the session's scenes. Data is made up, "today" is Mon Oct 26 2026,
   and everything lives in memory. Only .hs-page changes per layout; the AppShell around it is the design system's. */
:root{
  color-scheme:dark;
  /* Hearthside tokens (from the design system's tokens.json; one theme, Tavern) */
  --ground:#1a130e;--ground-2:#241a13;--surface:#2c2119;--line:#4a3726;--text:#f1e6d0;--muted:#b8a487;
  --on-wood-text:#fbf1dc;--on-wood-muted:#d4c2a2;--accent:#e5a13a;--accent-ink:#1a130e;--seal:#b4462c;--moss:#7c9a55;
  --verdigris:#5aa396;--paper:#eadbb9;--paper-hi:#f0e3c4;--paper-lo:#e2cea5;--paper-ink:#2b1d12;--paper-muted:#6b5337;
  --paper-line:#c9b28a;--leather-hi:#37281c;--leather:#221810;--gold-hi:#f6dd96;--gold:#d6a84e;--gold-lo:#8a5c1c;
  --gold-line:rgba(226,184,98,0.38);--gold-rule:rgba(226,184,98,0.14);
  --heat-0:rgba(43,29,18,0.06);--heat-1:#d8c092;--heat-2:#c49a5c;--heat-3:#9c6c32;--heat-4:#5a3a1a;--firelight:#ffb36b;
  --font-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --font-story:"IM Fell English",Georgia,serif;
  --font-body:"Alegreya Sans",system-ui,sans-serif;
  --font-label:"Alegreya Sans SC","Alegreya Sans",system-ui,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--sheet-foot:44px;
  --radius-sheet:3px;--radius:4px;--radius-panel:5px;--radius-full:999px;
  --shadow-panel:0 14px 30px rgba(0,0,0,0.55),0 2px 4px rgba(0,0,0,0.5);
  --shadow-panel-inset:inset 0 0 0 1px rgba(0,0,0,0.55),inset 0 0 26px rgba(0,0,0,0.5);
  --shadow-paper:0 16px 34px rgba(0,0,0,0.6),0 2px 4px rgba(0,0,0,0.45);
  --shadow-pin:0 2px 3px rgba(0,0,0,0.5);
  --on-wood-shadow:0 1px 2px rgba(0,0,0,0.9),0 0 14px rgba(0,0,0,0.6);
  --gild:linear-gradient(135deg,#f6dd96 0%,#b07c2c 22%,#f0cf7a 45%,#7c5318 68%,#e7c06a 88%,#a87228 100%);
  /* the prototype switcher only: deliberately not Hearthside */
  --proto-bg:#fafafa;--proto-fg:#111;--proto-dim:#555;
}
body{margin:0;background:var(--ground);color:var(--text)}
.hs-shell-wrap{padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hs-nav a{cursor:pointer}
.hs-page > *{align-self:stretch;min-width:0}
.hs-app textarea,.hs-app select{font:inherit;color:inherit}

/* ---------- material context: shared pieces read these, so they sit on parchment or leather alike ---------- */
.hs-sheet,.k-paper{--k-ink:var(--paper-ink);--k-muted:var(--paper-muted);--k-line:var(--paper-line);--k-hi:var(--seal);--k-pri:var(--paper-ink);--k-pri-ink:var(--paper);
  --k-field:rgba(255,250,235,.55);--k-torch:#9a4a12;--k-ok:#4d6a2c}
.hs-gilded,.k-leather{--k-ink:var(--text);--k-muted:var(--muted);--k-line:var(--gold-rule);--k-hi:var(--accent);--k-pri:var(--accent);--k-pri-ink:var(--accent-ink);
  --k-field:var(--surface);--k-torch:#f07b2c;--k-ok:var(--moss)}

/* ---------- shared bits ---------- */
.p-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.p-head > div{min-width:0}
.p-back{height:32px;font-size:14px}
.p-link{background:none;border:0;padding:0;color:var(--k-hi,var(--accent));cursor:pointer;font-family:var(--font-label);font-size:13.5px;font-weight:500;letter-spacing:.04em;text-decoration:none}
.p-link:hover{text-decoration:underline}
.ext::after{content:" ↗";font-family:var(--font-body)}
.k-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--k-ink);background:transparent;color:var(--k-ink);border-radius:var(--radius);padding:4px 12px;
  font-family:var(--font-label);font-size:14px;font-weight:500;letter-spacing:.04em;cursor:pointer;white-space:nowrap;text-decoration:none;line-height:1.4}
.hs-gilded .k-btn,.k-leather .k-btn{border-color:var(--gold-line);border-width:1px}
.hs-gilded .k-btn:hover,.k-leather .k-btn:hover{border-color:var(--gold)}
.k-btn.is-primary{background:var(--k-pri);color:var(--k-pri-ink);border-color:var(--k-pri)}
.k-btn:disabled{opacity:.55;cursor:default}
.k-btn.is-torch{border-color:var(--k-torch);color:var(--k-torch)}
.k-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.k-h{margin:0 0 8px;font-family:var(--font-label);font-size:13.5px;font-weight:500;letter-spacing:.1em;color:var(--k-muted);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.k-h .k-aside{font-family:var(--font-body);letter-spacing:0;font-size:13px}
.k-muted{color:var(--k-muted)}
.k-fine{font-size:13px;color:var(--k-muted);line-height:1.45;margin:6px 0 0}
.k-empty{font-size:14.5px;color:var(--k-muted);margin:0;line-height:1.5}
.k-slot{border:1.5px dashed var(--k-line);border-radius:var(--radius);padding:14px 16px}
.hs-sheet .k-slot{border-color:rgba(107,83,55,.45)}
.k-up{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.k-up input{position:absolute;width:1px;height:1px;opacity:0}
.k-up:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.k-ta{width:100%;min-height:150px;background:var(--k-field);border:1px solid var(--k-line);border-radius:var(--radius);padding:10px 12px;color:var(--k-ink);
  font-family:var(--font-story);font-size:16.5px;line-height:1.5;resize:vertical}
.hs-sheet .k-ta{border-color:var(--paper-line)}
.k-ta:focus{outline:2px solid var(--k-hi);outline-offset:1px}
/* a definition list that works on both materials */
.k-dl{margin:0;display:flex;flex-direction:column}
.k-dl > div{display:grid;grid-template-columns:minmax(84px,30%) minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px dotted var(--k-line);align-items:baseline}
.hs-gilded .k-dl > div{border-top-style:solid}
.k-dl > div:first-child{border-top:0}
.k-dl dt{font-family:var(--font-label);font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--k-muted)}
.k-dl dd{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.k-dl dd small{display:block;color:var(--k-muted);font-size:13px}
.k-pill{display:inline-block;font-family:var(--font-label);font-size:12px;font-weight:500;letter-spacing:.06em;padding:1px 8px;border-radius:var(--radius-full);border:1px solid currentColor;color:var(--k-muted);white-space:nowrap}
.k-pill.is-ok{color:var(--k-ok)}
.k-pill.is-hi{color:var(--k-hi)}
.k-pill.is-torch{color:var(--k-torch)}

/* portraits: a face in a gilded medallion. Stand-ins are painted by the page; no art = initials on dyed cloth. */
.art{position:absolute;inset:0;background-size:cover;background-position:center}
.pt{position:relative;display:block;aspect-ratio:1;overflow:hidden;background:var(--leather);border-radius:50%;container-type:inline-size}
.pt .art{background-size:170% auto;background-position:50% 45%}
.pt-none{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 15% 100%,rgba(255,179,107,.2),transparent 55%),linear-gradient(160deg,#4a3324,#1c120b)}
.pt-none span{font-family:var(--font-display);font-size:38cqw;color:var(--gold-hi);opacity:.85}
.pt-none.is-gm{background:radial-gradient(90% 90% at 50% 80%,rgba(240,123,44,.45),transparent 70%),linear-gradient(160deg,#4a2a18,#1c0f08)}
.medal{position:relative;display:block;flex:none;border-radius:50%;overflow:hidden;border:2px solid transparent;
  background:linear-gradient(var(--leather),var(--leather)) padding-box,var(--gild) border-box;box-shadow:0 3px 8px rgba(0,0,0,.55)}
.flame{display:inline-block;width:1em;height:1em;vertical-align:-.12em;color:var(--k-torch,#f07b2c)}

/* the torch line: orange and a flame wherever the Game Master's role changes hands (from the campaign prototype) */
.torch{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:14.5px;color:var(--k-ink)}
.torch b{color:var(--k-torch);font-weight:500}
.torch select{background:var(--k-field);border:1px solid var(--k-line);border-radius:var(--radius);padding:4px 8px;color:var(--k-ink);font-size:14px;max-width:100%}

/* the tale (the summary). Story face, a seal-red drop cap. */
.tale{font-family:var(--font-story);font-size:17px;line-height:1.55;color:var(--k-ink);max-width:66ch}
.tale p{margin:0 0 .75em}
.tale p:first-child::first-letter{float:left;font-family:var(--font-display);font-size:3.3em;line-height:.82;padding:6px 7px 0 0;color:var(--k-hi)}
.tale-by{font-family:var(--font-story);font-style:italic;font-size:15px;color:var(--k-muted);margin:0}

/* accounts: summaries anyone in the party uploads, kept as files */
.accts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.acct{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--k-line)}
.hs-sheet .acct{background:rgba(255,250,235,.35);border-color:rgba(107,83,55,.3);box-shadow:0 1px 2px rgba(60,40,20,.15)}
.hs-gilded .acct{background:rgba(0,0,0,.18)}
.acct-ic{position:relative;width:40px;height:50px;border-radius:2px;display:grid;place-items:end center;padding-bottom:5px;overflow:hidden;
  background:linear-gradient(160deg,#f3e7cc,#c9ad7c);box-shadow:0 1px 3px rgba(0,0,0,.4);font:700 10px/1 var(--font-label);letter-spacing:.06em;color:#5a3d22}
.acct-ic::before{content:"";position:absolute;left:7px;right:7px;top:9px;height:18px;background:repeating-linear-gradient(transparent 0 3px,rgba(90,61,34,.35) 3px 4px)}
.acct-ic.is-img{background-size:cover;background-position:center}
.acct-ic.is-img::before{display:none}
.acct-ic.is-audio::before{height:14px;top:14px;background:repeating-linear-gradient(90deg,rgba(90,61,34,.55) 0 2px,transparent 2px 4px);clip-path:polygon(0 50%,10% 20%,20% 70%,30% 0,40% 90%,50% 30%,60% 80%,70% 10%,80% 60%,90% 35%,100% 50%,100% 100%,0 100%)}
.acct-n{font-weight:500;font-size:14.5px;overflow-wrap:anywhere;line-height:1.3}
.acct-n button{all:unset;cursor:pointer;color:var(--k-ink)}
.acct-n button:hover{text-decoration:underline}
.acct-m{font-size:12.5px;color:var(--k-muted)}
.acct-x{background:none;border:0;color:var(--k-muted);cursor:pointer;font-size:18px;padding:4px 6px;line-height:1}
.acct-x:hover{color:var(--k-hi)}
.acct details{grid-column:2 / -1;font-size:14px}
.acct summary{cursor:pointer;color:var(--k-hi);font-family:var(--font-label);font-size:13px;letter-spacing:.04em}
.acct pre{margin:6px 0 0;white-space:pre-wrap;font:inherit;font-family:var(--font-story);font-size:15px;line-height:1.45;color:var(--k-ink);max-height:240px;overflow:auto}

/* the reel: an AI-painted film of the session's scenes, 16:9, in a gilded frame */
.reel-frame{position:relative;border:3px solid transparent;border-radius:var(--radius-panel);background:linear-gradient(#0b0806,#0b0806) padding-box,var(--gild) border-box;box-shadow:var(--shadow-panel)}
.reel{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:2px;background:#0b0806;container-type:inline-size;color:#fff}
.reel .art{opacity:0;transition:opacity .9s;transform:scale(1.03)}
.reel .art.is-on{opacity:1;animation:hs-kb 8s linear forwards;animation-play-state:paused}
.reel.is-playing .art.is-on{animation-play-state:running}
@keyframes hs-kb{from{transform:scale(1.03) translate(0,0)}to{transform:scale(1.16) translate(-2.5%,-1.5%)}}
.reel-cap{position:absolute;left:7%;right:7%;bottom:15%;margin:0;text-align:center;font-family:var(--font-story);font-size:clamp(13px,3.6cqw,22px);line-height:1.3;
  text-shadow:0 1px 3px #000,0 0 18px rgba(0,0,0,.9);transition:opacity .4s}
.reel-big{position:absolute;inset:0;margin:auto;width:clamp(48px,13cqw,78px);height:clamp(48px,13cqw,78px);border-radius:50%;border:2px solid rgba(246,221,150,.8);
  background:rgba(20,13,8,.6);color:var(--gold-hi);cursor:pointer;display:grid;place-items:center;box-shadow:0 0 30px rgba(0,0,0,.6)}
.reel-big svg{width:38%;height:38%;margin-left:6%}
.reel.is-playing .reel-big,.reel.is-started .reel-big{display:none}
.reel-title{position:absolute;left:0;right:0;top:0;padding:12px 16px 30px;background:linear-gradient(rgba(0,0,0,.7),transparent);font-family:var(--font-label);font-size:clamp(11px,2.4cqw,14px);letter-spacing:.08em;color:var(--gold-hi)}
.reel.is-started .reel-title{opacity:0;transition:opacity .6s}
.reel-ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.reel-ctl button.pp{background:none;border:0;color:#fff;cursor:pointer;width:26px;height:26px;padding:0;display:grid;place-items:center}
.reel-ctl button.pp svg{width:16px;height:16px}
.reel-ticks{flex:1;display:flex;gap:3px;min-width:0}
.reel-ticks button{flex:1;height:14px;padding:5px 0;background:none;border:0;cursor:pointer;min-width:0}
.reel-ticks i{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.reel-ticks i b{display:block;height:100%;width:0;background:var(--accent)}
.reel-time{font:500 12px/1 var(--font-label);letter-spacing:.05em;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85);white-space:nowrap}
.reel-under{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;margin-top:8px;font-size:13px;color:var(--k-muted)}
/* painting, and the empty slot */
.reel-wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:6% 10%;text-align:center}
.reel-wait .bn{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(10px) brightness(.4) saturate(.8)}
.reel-wait > :not(.bn){position:relative}
.reel-wait b{font-family:var(--font-story);font-weight:400;font-size:clamp(16px,4cqw,24px);color:var(--on-wood-text)}
.reel-wait p{margin:0;font-size:clamp(12px,2.6cqw,15px);color:var(--on-wood-muted);max-width:46ch}
.reel-prog{width:min(320px,70%);height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.reel-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--accent),var(--gold-hi));transition:width .2s}
.reel-wait .k-btn{border-color:var(--gold-line);color:var(--text)}
.reel-wait .k-btn.is-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.reel-ai{font-family:var(--font-label);letter-spacing:.06em}

/* quests, on either material */
.kq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.kq li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px dotted var(--k-line)}
.hs-gilded .kq li{border-top-style:solid;padding:9px 0}
.kq li:first-child{border-top:0}
.kq .hs-box{margin-top:2px;border-color:var(--k-muted)}
.kq .hs-box:disabled{cursor:default;opacity:.6}
.kq b{font-weight:500;font-size:14.5px;line-height:1.3}
.kq small{display:block;font-size:12.5px;color:var(--k-muted);line-height:1.4}
.kq .is-done b{text-decoration:line-through;color:var(--k-muted)}
.kq .t{font-family:var(--font-label);letter-spacing:.04em;color:var(--k-hi)}

/* the ready check */
.rc{display:flex;flex-direction:column;gap:10px}
.rc ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rc li{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.rc li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-dot{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--k-muted);color:var(--k-muted)}
.rc-dot.is-yes{background:var(--k-ok);border-color:var(--k-ok);color:#fff}
.rc-dot.is-no{background:var(--seal);border-color:var(--seal);color:#fff}

/* attendance, as the GM takes it */
.att-ed{display:flex;flex-direction:column;gap:6px}
.att-ed label{display:flex;align-items:center;gap:8px;font-size:14.5px;cursor:pointer}
.att-ed input[type=checkbox]{width:16px;height:16px;accent-color:var(--moss)}
.att-ed .said{font-size:12.5px;color:var(--k-muted)}
.att-q{margin:2px 0 4px 24px;padding:8px 10px;border-left:2px solid var(--k-hi);font-size:14px;display:flex;flex-direction:column;gap:6px}
.att-q .k-btn{font-size:13px;padding:2px 10px}
.att-q .k-btn[aria-pressed="true"]{background:var(--k-pri);color:var(--k-pri-ink);border-color:var(--k-pri)}

/* status lines (planning, cancelled) */
.k-banner{padding:10px 12px;border-radius:var(--radius);border:1.5px solid var(--k-hi);font-size:14.5px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}

/* ---------- A: The session sheet. One parchment page, read top to bottom. ---------- */
.va-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.va-steps{display:flex;gap:6px}
.va-steps button{height:32px;font-size:13.5px}
.va-sheet{padding-top:30px}
.va-sheet h1{margin:2px 0 0;font-family:var(--font-story);font-weight:400;font-size:clamp(28px,4vw,36px);line-height:1.1;text-wrap:balance}
.va-when{margin:6px 0 0;font-size:15.5px;color:var(--paper-ink)}
.va-when small{display:block;color:var(--paper-muted);font-size:14px}
.va-sec{margin-top:22px;padding-top:16px;border-top:1px solid var(--paper-line)}
.va-sec.is-first{border-top:0;padding-top:0;margin-top:18px}
.va-roll{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 10px}
.va-roll li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.va-roll .medal{width:66px;margin-bottom:4px}
.va-roll b{font-family:var(--font-story);font-weight:400;font-size:16.5px;line-height:1.15;overflow-wrap:anywhere}
.va-roll small{font-size:12.5px;color:var(--paper-muted);line-height:1.3}
.va-roll .note{font-style:italic;color:var(--seal)}
.va-roll .is-away .medal{filter:grayscale(1);opacity:.5}
.va-roll .is-away b{text-decoration:line-through;text-decoration-color:var(--paper-muted)}
.va-roll .is-played .medal{outline:2px dashed var(--seal);outline-offset:3px}
.va-roll .is-gm .medal{outline:2px solid #9a4a12;outline-offset:3px}
.va-roll .lv{font-family:var(--font-label);font-size:12px;letter-spacing:.06em;color:var(--k-ok)}
.va-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:640px){.va-two{grid-template-columns:minmax(0,1fr)}}

.vc-top{position:absolute;inset:13%;border-radius:50%;background-size:cover;background-position:center;

  font:500 clamp(10px,2cqw,13px)/1.3 var(--font-label);letter-spacing:.04em;white-space:nowrap}

<script src="bundle.js"></script>
<script>
document.body.classList.add('hs-app');

/* ---------------- stand-in art: portraits (as in the Adventurers prototype), the banner, and the reel's scenes ---------------- */
function rng(seed) { let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function ridge(ctx, r, W, y0, amp, step, color, H) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  let y = y0; for (let x = 0; x <= W + step; x += step) { y = Math.max(y0 - amp, Math.min(y0 + amp, y + (r() - .5) * amp)); ctx.lineTo(x, y); }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
const canvas = (W, H) => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
const sky = (ctx, W, H, stops) => { const g = ctx.createLinearGradient(0, 0, 0, H); stops.forEach(([o, col]) => g.addColorStop(o, col)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); };
const stars = (ctx, r, W, H, n, top = .8) => { for (let i = 0; i < n; i++) { const s = r(); ctx.fillStyle = `rgba(255,255,240,${.25 + s * .7})`; const z = s > .93 ? 3 : 1.5; ctx.fillRect(r() * W, r() * H * top, z, z); } };
function ship(ctx, x, y, s, rot, glow) {   // the Gull's Wager: a wedge with two engines
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  if (glow) { ctx.shadowColor = '#8fe3ff'; ctx.shadowBlur = 30; ctx.fillStyle = 'rgba(160,235,255,.9)'; [-14, 14].forEach(o => { ctx.beginPath(); ctx.ellipse(-62, o, 10, 6, 0, 0, 7); ctx.fill(); }); ctx.shadowBlur = 0; }
  ctx.fillStyle = '#0d0f1a'; ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(-50, -34); ctx.lineTo(-62, -20); ctx.lineTo(-62, 20); ctx.lineTo(-50, 34); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,200,120,.9)'; ctx.fillRect(20, -3, 8, 6);
  ctx.restore();
}
function paintBanner() {   // Starfall Salvage's banner (4:1), as on the Campaigns page
  const W = 1600, H = 400, [c, ctx] = canvas(W, H), r = rng('starfall');
  sky(ctx, W, H, [[0, '#060a1c'], [.6, '#13294a'], [1, '#2f6a74']]); stars(ctx, r, W, H, 380, .75);
  const g = ctx.createLinearGradient(300, 40, 760, 220); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,236,190,.95)');
  ctx.strokeStyle = g; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(300, 40); ctx.lineTo(760, 220); ctx.stroke();
  ridge(ctx, r, W, 300, 26, 60, '#3a3550', H);
  ctx.fillStyle = '#16142a'; ctx.beginPath(); ctx.moveTo(380, 330); ctx.quadraticCurveTo(520, 200, 720, 300); ctx.lineTo(700, 330); ctx.closePath(); ctx.fill();
  for (let i = 0; i < 6; i++) ctx.fillRect(430 + i * 45, 250 - Math.sin(i / 5 * Math.PI) * 30, 7, 90);
  ridge(ctx, r, W, 350, 18, 50, '#0b0a18', H);
  return c.toDataURL('image/jpeg', .85);
}
/* The reel's scenes, 16:9: stand-ins for what an AI video model would paint from the tale */
function paintScene(kind) {
  const W = 1280, H = 720, [c, ctx] = canvas(W, H), r = rng(kind);
  if (kind === 'drift') {
    sky(ctx, W, H, [[0, '#04050f'], [1, '#161c3a']]);
    ctx.lineWidth = 2; for (let i = 0; i < 70; i++) { const a = r() * 7, d0 = 60 + r() * 200, d1 = d0 + 80 + r() * 260; ctx.strokeStyle = `rgba(170,200,255,${.08 + r() * .25})`;
      ctx.beginPath(); ctx.moveTo(420 + Math.cos(a) * d0, 300 + Math.sin(a) * d0); ctx.lineTo(420 + Math.cos(a) * d1, 300 + Math.sin(a) * d1); ctx.stroke(); }
    stars(ctx, r, W, H, 160, 1);
    let g = ctx.createRadialGradient(1000, 760, 40, 1040, 820, 520); g.addColorStop(0, '#9a9488'); g.addColorStop(.7, '#4a4640'); g.addColorStop(1, '#141210');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(1040, 880, 470, 0, 7); ctx.fill();
    for (let i = 0; i < 18; i++) { ctx.fillStyle = `rgba(20,18,16,${.2 + r() * .3})`; ctx.beginPath(); ctx.ellipse(700 + r() * 600, 470 + r() * 250, 10 + r() * 34, 6 + r() * 14, 0, 0, 7); ctx.fill(); }
    ship(ctx, 430, 300, 1.4, .25, true);
  } else if (kind === 'signal') {
    sky(ctx, W, H, [[0, '#050812'], [.7, '#0f2a32'], [1, '#1b4a4a']]); stars(ctx, r, W, H, 200, .6);
    ridge(ctx, r, W, 560, 40, 40, '#141c22', H);
    ctx.fillStyle = '#0a0e12'; ctx.fillRect(626, 300, 28, 270); ctx.beginPath(); ctx.moveTo(600, 570); ctx.lineTo(640, 420); ctx.lineTo(680, 570); ctx.fill();
    ctx.shadowColor = '#7ff2df'; ctx.shadowBlur = 40; ctx.fillStyle = '#c8fff4'; ctx.beginPath(); ctx.arc(640, 296, 12, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    for (let k = 1; k <= 7; k++) { ctx.strokeStyle = `rgba(127,242,223,${.55 - k * .07})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(640, 296, k * 62, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); }
    ridge(ctx, r, W, 640, 20, 30, '#06080a', H);
  } else if (kind === 'hold') {
    ctx.fillStyle = '#07080a'; ctx.fillRect(0, 0, W, H);
    const vx = 700, vy = 330;
    for (let k = 0; k < 9; k++) { const t = k / 9, x0 = vx - (vx + 40) * (1 - t), x1 = vx + (W - vx + 40) * (1 - t), y0 = vy - (vy + 40) * (1 - t), y1 = vy + (H - vy + 40) * (1 - t);
      ctx.strokeStyle = `rgba(120,140,150,${.12 + t * .1})`; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
      ctx.fillStyle = `rgba(255,70,40,${.5 - t * .4})`; ctx.fillRect(x0 + 6, y0 + 6, 18 * (1 - t) + 3, 6 * (1 - t) + 2); }
    const g = ctx.createRadialGradient(vx, vy, 4, vx, vy, 160); g.addColorStop(0, 'rgba(200,240,255,.8)'); g.addColorStop(1, 'rgba(200,240,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#020203';
    [[520, 470, 1.15], [860, 490, 1.25]].forEach(([x, y, s]) => { ctx.beginPath(); ctx.arc(x, y - 120 * s, 26 * s, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(x, y + 40 * s, 52 * s, 150 * s, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(x - 40 * s, y - 100 * s, 80 * s, 200 * s); });
    for (let i = 0; i < 40; i++) { ctx.fillStyle = `rgba(255,${150 + r() * 90 | 0},60,${r()})`; ctx.fillRect(860 + (r() - .5) * 160, 330 + r() * 120, 2, 2); }
  } else if (kind === 'beacon') {
    sky(ctx, W, H, [[0, '#0a0606'], [1, '#1a0c0a']]);
    ctx.fillStyle = '#120a08'; for (let i = 0; i < 14; i++) { ctx.save(); ctx.translate(640, 380); ctx.rotate(i / 14 * Math.PI * 2 + r() * .2); ctx.fillRect(90, -14, 260 + r() * 200, 28); ctx.restore(); }
    let g = ctx.createRadialGradient(640, 380, 10, 640, 380, 300); g.addColorStop(0, 'rgba(180,255,240,1)'); g.addColorStop(.18, 'rgba(90,200,190,.8)'); g.addColorStop(1, 'rgba(90,200,190,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(30,20,16,.95)'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(640, 380, 120, 0, 7); ctx.stroke();
    for (let i = 0; i < 120; i++) { const a = r() * 7, d = 120 + r() * 380; ctx.fillStyle = `rgba(255,${160 + r() * 80 | 0},70,${r() * .9})`; ctx.fillRect(640 + Math.cos(a) * d, 380 + Math.sin(a) * d, 3, 3); }
    ctx.fillStyle = '#030202'; ctx.beginPath(); ctx.ellipse(170, 760, 210, 360, .1, Math.PI, 0); ctx.fill(); ctx.beginPath(); ctx.arc(190, 420, 64, 0, 7); ctx.fill();
  } else if (kind === 'escape') {
    sky(ctx, W, H, [[0, '#03040b'], [1, '#101634']]); stars(ctx, r, W, H, 260, 1);
    for (let i = 0; i < 46; i++) { ctx.save(); ctx.translate(r() * W, r() * H); ctx.rotate(r() * 7); ctx.fillStyle = `rgba(${40 + r() * 40 | 0},${36 + r() * 30 | 0},${40 + r() * 30 | 0},.95)`;
      const s = 8 + r() * 46; ctx.fillRect(-s, -s / 2, s * 2, s); ctx.restore(); }
    const g = ctx.createLinearGradient(0, 600, 820, 330); g.addColorStop(0, 'rgba(143,227,255,0)'); g.addColorStop(1, 'rgba(143,227,255,.9)');
    ctx.strokeStyle = g; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(0, 640); ctx.quadraticCurveTo(420, 520, 800, 340); ctx.stroke();
    ship(ctx, 860, 312, 1.5, -.42, true);
    for (let k = 1; k <= 4; k++) { ctx.strokeStyle = `rgba(127,242,223,${.35 - k * .07})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(110, 690, k * 70, Math.PI * 1.5, Math.PI * 2); ctx.stroke(); }
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  return c.toDataURL('image/jpeg', .84);
}
function paintPortrait(p) {
  const W = 480, H = 640, [c, ctx] = canvas(W, H), r = rng(p.seed);
  let g = ctx.createRadialGradient(W * .38, H * .32, 20, W * .5, H * .5, H * .8); g.addColorStop(0, p.bg[0]); g.addColorStop(1, p.bg[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  stars(ctx, r, W, H, 120);
  figure(ctx, p.gear, -7, -2, p.rim || '#ffb36b'); figure(ctx, p.gear, 0, 0, '#140d09');
  (p.glow || []).forEach(([x, y, rad, col]) => { ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, rad, 0, 7); ctx.fill(); });
  ctx.shadowBlur = 0;
  return c.toDataURL('image/jpeg', .86);
}
function figure(ctx, gear = '', dx, dy, col) {
  const cx = 240; ctx.save(); ctx.translate(dx, dy); ctx.fillStyle = col;
  if (gear.includes('long')) { ctx.beginPath(); ctx.ellipse(cx, 360, 118, 175, 0, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(cx, 730, 228, 260, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(cx - 34, 380, 68, 120);
  ctx.beginPath(); ctx.ellipse(cx, 300, 82, 104, 0, 0, 7); ctx.fill();
  if (gear.includes('ears')) [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(cx + s * 92, 200, 46, 56, s * .4, 0, 7); ctx.fill(); });
  if (gear.includes('helm')) { ctx.fillRect(cx - 92, 226, 184, 110); [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(cx + s * 165, 505, 78, 50, s * .25, 0, 7); ctx.fill(); }); }
  if (gear.includes('wide')) { ctx.beginPath(); ctx.ellipse(cx, 218, 172, 26, -.06, 0, 7); ctx.fill(); ctx.beginPath(); ctx.moveTo(cx - 82, 218); ctx.lineTo(cx - 62, 128); ctx.quadraticCurveTo(cx, 96, cx + 70, 130); ctx.lineTo(cx + 84, 218); ctx.fill(); }
  ctx.restore();
}
function paintNotes() {   // a photo of handwritten notes, for an uploaded account
  const [c, ctx] = canvas(160, 200), r = rng('notes');
  ctx.fillStyle = '#efe6cf'; ctx.fillRect(0, 0, 160, 200);
  ctx.strokeStyle = 'rgba(80,120,170,.35)'; for (let y = 24; y < 200; y += 12) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(160, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(30,30,60,.75)'; ctx.lineWidth = 1.4;
  for (let y = 22; y < 190; y += 12) { let x = 10 + r() * 8; ctx.beginPath(); ctx.moveTo(x, y); while (x < 140 - r() * 40) { x += 4 + r() * 6; ctx.lineTo(x, y - 2 - r() * 5); } ctx.stroke(); }
  return c.toDataURL('image/jpeg', .8);
}

function paintWave() {   // an audio recording's waveform
  const [c, ctx] = canvas(800, 200), r = rng('wave');
  ctx.fillStyle = 'rgba(246,221,150,.85)';
  for (let x = 0; x < 800; x += 6) { const h = 8 + Math.abs(Math.sin(x / 37) * Math.cos(x / 91)) * 160 * (.35 + r() * .65); ctx.fillRect(x, 100 - h / 2, 3, h); }
  return c.toDataURL('image/png');
}

/* The round table, from above: eight oak boards pegged to battens underneath, with grain running round the knots; a
   bent-wood rim with its grain running round the edge; the wear of game nights (cup rings, scratches, dice left out);
   and varnish catching the hearth's light from the lower left. */
const shade = (hex, n) => '#' + [1, 3, 5].map(i => Math.max(0, Math.min(255, parseInt(hex.slice(i, i + 2), 16) + n)).toString(16).padStart(2, '0')).join('');
function paintTable() {
  const S = 1400, C = S / 2, RT = 700, RB = 648, [c, ctx] = canvas(S, S), r = rng('table');
  ctx.fillStyle = '#1a130e'; ctx.fillRect(0, 0, S, S);
  ctx.save(); ctx.beginPath(); ctx.arc(C, C, RB, 0, 7); ctx.clip();
  const PW = S / 8, tones = ['#7a4a26', '#6c3f20', '#83522b', '#714424', '#7d4d28', '#673c1e', '#805029', '#6f4222'];
  for (let i = 0; i < 8; i++) {
    const x0 = i * PW, g = ctx.createLinearGradient(0, 0, 0, S);
    g.addColorStop(0, shade(tones[i], -12)); g.addColorStop(.45, tones[i]); g.addColorStop(1, shade(tones[i], -16));
    ctx.fillStyle = g; ctx.fillRect(x0, 0, PW, S);
    const knots = Array.from({ length: 1 + (r() * 2 | 0) }, () => [x0 + PW * (.25 + r() * .5), S * (.1 + r() * .8), 7 + r() * 12]);
    for (let k = 0; k < 52; k++) {   // grain: long wavering lines that bend round the knots
      const bx = x0 + r() * PW, ph = r() * 6, f = 90 + r() * 160, a = .05 + r() * .2, dark = r() < .8;
      ctx.strokeStyle = dark ? `rgba(38,18,7,${a})` : `rgba(255,222,170,${a * .45})`; ctx.lineWidth = .6 + r() * 1.7; ctx.beginPath();
      for (let y = -10; y <= S + 10; y += 10) {
        let x = bx + Math.sin(y / f + ph) * 3 + Math.sin(y / 23 + ph * 2) * .6;
        knots.forEach(([kx, ky, kr]) => { const dx = x - kx, dy = y - ky; x += Math.sign(dx || 1) * kr * 1.7 * Math.exp(-(dy * dy) / (kr * kr * 10)) * Math.exp(-(dx * dx) / (kr * kr * 12)); });
        y < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    knots.forEach(([kx, ky, kr]) => {
      const kg = ctx.createRadialGradient(kx, ky, 0, kx, ky, kr * 1.5); kg.addColorStop(0, 'rgba(28,12,4,.9)'); kg.addColorStop(.6, 'rgba(50,24,9,.5)'); kg.addColorStop(1, 'rgba(50,24,9,0)');
      ctx.fillStyle = kg; ctx.beginPath(); ctx.ellipse(kx, ky, kr * 1.1, kr * 1.6, 0, 0, 7); ctx.fill();
      for (let j = 1; j < 4; j++) { ctx.strokeStyle = `rgba(35,16,6,${.38 - j * .08})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(kx, ky, kr * (1 + j * .5), kr * (1.6 + j * 1), 0, 0, 7); ctx.stroke(); }
    });
    for (let k = 0; k < 300; k++) { ctx.fillStyle = `rgba(28,12,4,${.1 + r() * .2})`; ctx.fillRect(x0 + r() * PW, r() * S, .9, 3 + r() * 7); }   // pores
    ctx.fillStyle = '#1b0d04'; ctx.fillRect(x0 - 1.5, 0, 3, S);                                                            // the seam
    ctx.fillStyle = 'rgba(255,215,160,.13)'; ctx.fillRect(x0 + 1.5, 0, 1.2, S);
    [.26, .74].forEach(fy => { const py = S * fy + (r() - .5) * 8, px = x0 + PW / 2 + (r() - .5) * 10;   // pegs into the battens
      ctx.fillStyle = '#2a1407'; ctx.beginPath(); ctx.arc(px, py, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,215,160,.18)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px, py, 8, Math.PI * 1.1, Math.PI * 1.7); ctx.stroke(); });
  }
  // the wear of game nights
  [[S * .79, S * .3, 44], [S * .2, S * .64, 40], [S * .34, S * .13, 38]].forEach(([x, y, rr]) => {
    ctx.strokeStyle = 'rgba(22,10,3,.32)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, rr, .3, Math.PI * 1.85); ctx.stroke();
    ctx.strokeStyle = 'rgba(22,10,3,.14)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + 3, y + 2, rr - 7, 0, 7); ctx.stroke(); });
  for (let k = 0; k < 40; k++) { const x = r() * S, y = r() * S, a = r() * 7, l = 20 + r() * 70; ctx.strokeStyle = `rgba(255,226,182,${.06 + r() * .1})`; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke(); }
  // dice left out, at the foot of the table: a d20 and a d6
  const die = (x, y, fn) => { ctx.save(); ctx.translate(x, y); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5; fn(); ctx.restore(); };
  die(C - 50, S * .885, () => { ctx.rotate(.3); ctx.fillStyle = '#a63e25'; ctx.beginPath(); for (let i = 0; i < 6; i++) ctx.lineTo(Math.cos(i * Math.PI / 3) * 34, Math.sin(i * Math.PI / 3) * 34); ctx.closePath(); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.strokeStyle = 'rgba(255,200,170,.55)'; ctx.lineWidth = 1.5; ctx.beginPath();
    const t = [0, 2, 4].map(i => [Math.cos(i * Math.PI / 3 + Math.PI / 6) * 20, Math.sin(i * Math.PI / 3 + Math.PI / 6) * 20]);
    ctx.moveTo(...t[0]); ctx.lineTo(...t[1]); ctx.lineTo(...t[2]); ctx.closePath();
    for (let i = 0; i < 6; i++) { const v = [Math.cos(i * Math.PI / 3) * 34, Math.sin(i * Math.PI / 3) * 34], n = t[[0, 0, 1, 1, 2, 2][(i + 5) % 6]]; ctx.moveTo(...v); ctx.lineTo(...n); }
    ctx.stroke(); ctx.fillStyle = '#fbe9d8'; ctx.font = 'bold 15px Georgia'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('20', 0, 1); });
  die(C + 62, S * .9, () => { ctx.rotate(-.42); ctx.fillStyle = '#e8dbbe'; ctx.beginPath(); ctx.roundRect(-24, -24, 48, 48, 8); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.fillStyle = '#2b1d12'; [[-11, -11], [11, -11], [0, 0], [-11, 11], [11, 11]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill(); }); });
  ctx.restore();
  // the rim: bent wood, grain running round, bevelled at both edges
  ctx.save(); ctx.beginPath(); ctx.arc(C, C, RT, 0, 7); ctx.arc(C, C, RB, 0, 7, true); ctx.clip();
  ctx.fillStyle = '#5e361a'; ctx.fillRect(0, 0, S, S);
  for (let k = 0; k < 90; k++) { const rr = RB + r() * (RT - RB), a0 = r() * 7; ctx.strokeStyle = r() < .8 ? `rgba(35,16,6,${.12 + r() * .28})` : `rgba(255,215,160,${.06 + r() * .1})`;
    ctx.lineWidth = .6 + r() * 1.5; ctx.beginPath(); ctx.arc(C, C, rr, a0, a0 + .6 + r() * 3.5); ctx.stroke(); }
  const bev = ctx.createRadialGradient(C, C, RB, C, C, RT);
  bev.addColorStop(0, 'rgba(0,0,0,.6)'); bev.addColorStop(.12, 'rgba(255,215,160,.26)'); bev.addColorStop(.5, 'rgba(255,215,160,.06)'); bev.addColorStop(.9, 'rgba(0,0,0,.25)'); bev.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = bev; ctx.fillRect(0, 0, S, S);
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + .4; ctx.strokeStyle = 'rgba(20,9,3,.7)'; ctx.lineWidth = 2;   // where the rim's four pieces join
    ctx.beginPath(); ctx.moveTo(C + Math.cos(a) * RB, C + Math.sin(a) * RB); ctx.lineTo(C + Math.cos(a) * RT, C + Math.sin(a) * RT); ctx.stroke(); }
  ctx.restore();
  // varnish: warm light from the hearth at the lower left, a sheen up top, darker towards the edge
  ctx.save(); ctx.beginPath(); ctx.arc(C, C, RT, 0, 7); ctx.clip();
  let g = ctx.createRadialGradient(S * .18, S * .86, 0, S * .18, S * .86, S * .85); g.addColorStop(0, 'rgba(255,170,90,.24)'); g.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  g = ctx.createRadialGradient(S * .62, S * .27, 0, S * .62, S * .27, S * .42); g.addColorStop(0, 'rgba(255,240,215,.14)'); g.addColorStop(1, 'rgba(255,240,215,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  g = ctx.createRadialGradient(C, C, RB * .5, C, C, RT); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.32)'); ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
  ctx.restore();

  if (taleDraft !== null) return `<textarea class="k-ta" id="tale-ta" aria-label="The tale" placeholder="What happened? Write it like you'd tell it at the next session.">${esc(taleDraft)}</textarea>
    <div class="k-row" style="margin-top:8px"><button type="button" class="k-btn is-primary" data-talesave="1">Save the tale</button><button type="button" class="k-btn" data-talecancel="1">Cancel</button>
    <span class="k-fine" style="margin:0">Everyone in the party can read it. Blank lines start a new paragraph.</span></div>`;
  if (!s.tale) return `<div class="k-slot"><p class="k-empty">${isGM() ? "Nobody's told this one yet. Write up what happened while it's fresh: it's what the party reads before the next session, and what the reel is painted from." : `${esc(GM.name)} hasn't written this one up yet. Anyone in the party can add their own account in the meantime.`}</p>
    ${isGM() ? '<div class="k-row" style="margin-top:10px"><button type="button" class="k-btn is-primary" data-talewrite="1">Write the tale</button></div>' : ''}</div>`;
  return `<div class="tale">${s.tale.text.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join('')}</div>
    ${sign ? `<p class="tale-by">Told by ${esc(you(s.tale.by) === 'You' ? 'you' : nameOf(s.tale.by))}, ${CAMP.gmTitle}, ${dayLabel(s.tale.at)}${s.tale.from === 'recording' ? ', from an AI draft of the recording' : ''}${isGM() ? ` · <button type="button" class="p-link" data-talewrite="1">Edit</button>` : ''}</p>` : ''}`;
}
/* accounts: summaries anyone in the party uploads. Kept as files: a PDF, a doc, a photo of notes, a voice memo. */
const kindOf = f => /pdf/.test(f.type) ? 'PDF' : /^image/.test(f.type) ? 'IMG' : /^audio/.test(f.type) ? 'AUDIO' : /text\/(plain|markdown)|\.md$|\.txt$/.test(f.type + f.name) ? 'TXT' : 'DOC';
function accountsHTML(s) {
  if (s.status !== 'completed') return '';
  const list = s.accounts.map(f => { const k = kindOf(f);
    return `<li class="acct"><span class="acct-ic ${k === 'IMG' ? 'is-img' : k === 'AUDIO' ? 'is-audio' : ''} ${f.thumb ? 'art-' + f.thumb : ''}" ${f.url && k === 'IMG' ? `style="background-image:url(${f.url})"` : ''}>${k === 'IMG' ? '' : k}</span>
      <div style="min-width:0"><div class="acct-n"><button type="button" data-fopen="${f.id}">${esc(f.name)}</button></div><div class="acct-m">${esc(you(f.by))} · ${dayLabel(f.at)} · ${kb(f.size)}</div></div>
      ${f.by === viewer || isGM() ? `<button type="button" class="acct-x" data-fdel="${f.id}" aria-label="Remove ${esc(f.name)}" title="Remove">×</button>` : '<span></span>'}
      ${f.text ? `<details><summary>Read it here</summary><pre>${esc(f.text)}</pre></details>` : ''}</li>`; }).join('');
  return `${list ? `<ul class="accts">${list}</ul>` : `<p class="k-empty">No accounts yet. Journals, notes, a photo of your scribbles, a voice memo: anyone in the party can add one.</p>`}
    <div class="k-row" style="margin-top:10px"><label class="k-btn k-up">Add your account<input type="file" data-acct="1" accept=".pdf,.doc,.docx,.odt,.rtf,.txt,.md,image/*,audio/*"></label>
    <span class="k-fine" style="margin:0">PDF, a document, text, a picture or audio. Kept as it is.</span></div>`;
}
/* the reel: an AI-painted film of the session's scenes, made from the tale */
const SCENE_MS = 8000;
let reelT = 0, reelPlaying = false, reelTimer = null;
function reelHTML(s, { hero = false } = {}) {
  const r = s.reel;
  const wait = (inner) => `<div class="reel-frame"><div class="reel"><div class="reel-wait"><span class="bn art-${ART.banner}"></span>${inner}</div></div></div>`;
  if (s.status === 'cancelled') return '';
  if (s.status !== 'completed') return hero ? '' : `<div class="k-slot"><p class="k-empty">After the session, a reel of its scenes can be painted from the tale.</p></div>`;
  if (r?.state === 'ready') {
    return `<div class="reel-frame">${reelPlayer(s)}</div>
      <div class="reel-under"><span class="reel-ai">Painted by AI from the tale · ${r.scenes.length} scenes · ${dayLabel(r.at)}</span>

  }

      <p class="reel-stage">Scene ${n} of ${SCENES.length}: ${esc(SCENES[n - 1].cap)}</p><p style="opacity:.8">The party gets a letter when it's ready.</p>`);

  return wait(isGM() ? `<b>Paint the reel?</b><p>About ${SCENES.length} scenes and 40 seconds, painted by AI from the tale (${words(s.tale.text)} words) and the party's portraits.</p>
      <div class="k-row" style="justify-content:center"><button type="button" class="k-btn is-primary" data-paint="1">Paint the reel</button></div>`
    : `<b>No reel yet</b><p>${esc(GM.name)} can have Hearthside paint a short film of this session's scenes from the tale.</p>`);
}
/* the player: painted scenes with a slow pan and captions, standing in for a generated video */
function reelPlayer(s, { full = false } = {}) {
  const r = s.reel, total = r.scenes.length * SCENE_MS;
  return `<div class="reel" data-reel="1">
      ${r.scenes.map((sc, i) => `<span class="art art-${sc.art} ${i === 0 ? 'is-on' : ''}"></span>`).join('')}
      <div class="reel-title">${esc(kicker(s))} · ${esc(sTitle(s))}</div>
      <p class="reel-cap"></p>
      <button type="button" class="reel-big" data-reelplay="1" aria-label="Play">${playIc}</button>
      <div class="reel-ctl"><button type="button" class="pp" data-reelplay="1" aria-label="Play or pause">${playIc}</button>
        <div class="reel-ticks">${r.scenes.map((sc, i) => `<button type="button" data-reelgo="${i}" aria-label="Scene ${i + 1}: ${esc(sc.cap)}"><i><b></b></i></button>`).join('')}</div>
        <span class="reel-time">0:00 / ${fmtT(total)}</span>
        <button type="button" class="fs" data-full="${full ? 0 : 1}" aria-label="${full ? 'Leave full screen' : 'Full screen'}" title="${full ? 'Leave full screen' : 'Full screen'}">${full ? shrinkIc : growIc}</button></div></div>`;
}
/* pop the cinematic out of its card: an overlay over the whole window, made truly full screen when the browser lets it.
   It plays on from where it was. */
function openFull() {
  ov = { kind: 'full' }; renderOv();
  const el = document.querySelector('.cine-full');
  try { el.requestFullscreen?.({ navigationUI: 'hide' })?.catch(() => {}); } catch {}
  if (!reelPlaying) reelToggle(true);
  el.querySelector('.cine-full-x').focus({ preventScroll: true });
}
function closeFull() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  ov = null; renderOv();
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && ov?.kind === 'full') { ov = null; renderOv(); } });
const fmtT = ms => { const t = Math.round(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
function reelSync() {
  const r = cur.reel; if (r?.state !== 'ready') return;
  const total = r.scenes.length * SCENE_MS, i = Math.min(r.scenes.length - 1, Math.floor(reelT / SCENE_MS)), started = reelPlaying || reelT > 0;
  document.querySelectorAll('[data-reel]').forEach(el => {
    el.classList.toggle('is-playing', reelPlaying); el.classList.toggle('is-started', started);
    el.querySelectorAll(':scope > .art').forEach((a, j) => a.classList.toggle('is-on', j === i));
    el.querySelector('.reel-cap').textContent = started ? r.scenes[i].cap : '';
    el.querySelectorAll('.reel-ticks b').forEach((b, j) => b.style.width = `${Math.max(0, Math.min(1, (reelT - j * SCENE_MS) / SCENE_MS)) * 100}%`);
    el.querySelector('.reel-time').textContent = `${fmtT(reelT)} / ${fmtT(total)}`;
    el.querySelector('.pp').innerHTML = reelPlaying ? pauseIc : playIc;

}
function reelToggle(force) {

function VariantC() {

  try { const u = new URL(location.href); u.searchParams.set('variant', v.key); u.searchParams.set('state', st.key); u.searchParams.set('as', viewer); history.replaceState(null, '', u); } catch {}
}
function reset() { clearInterval(paintTimer); reelToggle(false); reelT = 0; attDraft = null; taleDraft = null; cTab = null; ov = null; cFlip = false; qAdd = null; prepDraft = null; taleFrom = null; renderOv(); cur = STATES[stateI].make(); if (cur.reel?.state === 'painting') paint(cur); }
function go(d) { variant = (variant + d + VARIANTS.length) % VARIANTS.length; render(); }
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('state').onclick = () => { stateI = (stateI + 1) % STATES.length; reset(); render(); };
document.getElementById('who').onclick = () => { viewer = viewer === 'avery' ? 'geoff' : 'avery'; attDraft = null; taleDraft = null; taleFrom = null; prepDraft = null; qAdd = null; cTab = null; render(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape' && ov) { ov.kind === 'full' ? closeFull() : (ov = null, renderOv()); return; }
  if (ov || e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1);
});
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3000); }

document.addEventListener('click', e => {
  if (e.target.matches('.dlg-back')) { ov = null; renderOv(); return; }
  const el = e.target.closest('[data-q],[data-stub],[data-edit],[data-ready],[data-torchback],[data-talewrite],[data-talesave],[data-talecancel],[data-fopen],[data-fdel],[data-reelplay],[data-reelgo],[data-paint],[data-paintgo],[data-reeldel],[data-attedit],[data-attp],[data-stood],[data-attsave],[data-attcancel],[data-ctab],[data-ovclose],[data-flip],[data-full],[data-recplay],[data-watch],[data-recdel],[data-draft],[data-qadd],[data-prepedit],[data-prepsave],[data-prepcancel]');
  if (!el || el.matches('input[type=checkbox]') && !el.dataset.attp) return;
  const d = el.dataset, s = cur;
  if (el.matches('input[type=checkbox]')) { /* attendance checkbox: let it toggle, then mirror it */ }
  else e.preventDefault();
  if (d.q) { const q = s.quests.find(x => x.id === d.q); q.done = !q.done; render(); }
  else if (d.stub) toast(`Prototype: this goes to ${d.stub}.`);
  else if (d.edit) openEdit(d.edit);
  else if (d.ready) { s.ready.r[viewer] = d.ready === '1'; render(); }
  else if (d.torchback) { s.standIn = null; render(); toast('The torch is back with Avery for this session.'); }
  else if (d.flip) {   // turn the card over in place (no re-render, so it animates), and hand focus to the side now showing
    cFlip = d.flip === '1'; if (!cFlip) reelToggle(false);
    const m = document.querySelector('.vc-mid'), lift = m.querySelector('.vc-lift');
    m.classList.toggle('is-flipped', cFlip);
    m.querySelector('.vc-front').inert = cFlip; m.querySelector('.vc-back').inert = !cFlip;
    lift.classList.remove('is-turning'); void lift.offsetWidth; lift.classList.add('is-turning');
    m.querySelector(cFlip ? '.vc-back .vc-flipbtn' : '.vc-front .vc-flipbtn')?.focus({ preventScroll: true });
  }
  else if (d.full) d.full === '1' ? openFull() : closeFull();
  else if (d.recplay) toast(`Prototype: this plays the ${s.rec.dur} ${s.rec.kind} recording.`);
  else if (d.watch) { ov = { kind: 'watch', what: d.watch }; renderOv(); }
  else if (d.recdel) { s.rec = null; render(); }
  else if (d.draft) draftTale(s);
  else if (d.qadd) { qAdd = d.qadd; render(); document.querySelector(`[data-qnew="${d.qadd}"]`)?.focus(); }
  else if (d.prepedit) { prepDraft = s.agenda || ''; render(); document.getElementById('prep-ta')?.focus(); }
  else if (d.prepsave) { s.agenda = (prepDraft || '').trim(); prepDraft = null; render(); }
  else if (d.prepcancel) { prepDraft = null; render(); }
  else if (d.talewrite) { taleDraft = s.tale?.text || ''; taleFrom = s.tale?.from || null; cTab = 'tale'; render(); const t = document.getElementById('tale-ta'); t?.focus(); t?.scrollIntoView({ block: 'center' }); }
  else if (d.talesave) { const t = (taleDraft || '').trim(); s.tale = t ? { text: t, by: viewer, at: now(), from: taleFrom } : null; if (!t) s.reel = null; taleDraft = null; taleFrom = null; render(); }
  else if (d.talecancel) { taleDraft = null; taleFrom = null; render(); }
  else if (d.fopen) { const f = s.accounts.find(x => x.id === d.fopen); f.url ? open(f.url, '_blank') : toast(`Prototype: this opens ${f.name}.`); }
  else if (d.fdel) { s.accounts = s.accounts.filter(x => x.id !== d.fdel); render(); }
  else if (d.reelplay) reelToggle();
  else if (d.reelgo) reelGo(+d.reelgo);
  else if (d.paint) { ov = { kind: 'paint' }; renderOv(); }
  else if (d.paintgo) { ov = null; renderOv(); s.reel = { state: 'painting', p: 0 }; cTab = 'reel'; cFlip = true; render(); paint(s); }
  else if (d.reeldel) { reelToggle(false); reelT = 0; s.reel = null; render(); }
  else if (d.attedit) { startAtt(s); render(); }
  else if (d.attp) { attDraft.came.has(d.attp) ? attDraft.came.delete(d.attp) : attDraft.came.add(d.attp); render(); }
  else if (d.stood) { d.v === '1' ? attDraft.stood.add(d.stood) : attDraft.stood.delete(d.stood); render(); }
  else if (d.attsave) { s.att = { taken: true, came: attDraft.came, stood: new Set([...attDraft.stood].filter(id => !attDraft.came.has(id))) }; attDraft = null; render(); toast('Prototype: attendance saved in memory. Each adventurer’s road would update.'); }
  else if (d.attcancel) { attDraft = null; render(); }
  else if (d.ctab) { cTab = d.ctab; render(); }
  else if (d.ovclose) { ov = null; renderOv(); }
});
document.addEventListener('input', e => { if (e.target.id === 'tale-ta') taleDraft = e.target.value; else if (e.target.id === 'prep-ta') prepDraft = e.target.value; });
// "+ quest" at a seat: Enter adds it for that player, due when the session starts; Escape or leaving it empty closes it
document.addEventListener('keydown', e => {
  const t = e.target; if (!t.dataset?.qnew) return;
  if (e.key === 'Enter') { e.preventDefault(); const v = t.value.trim(); if (v) cur.quests.push({ id: 'n' + Date.now(), title: v, who: t.dataset.qnew, due: cur.date, done: false }); qAdd = null; render(); }
  else if (e.key === 'Escape') { e.stopPropagation(); qAdd = null; render(); }
}, true);
document.addEventListener('focusout', e => { if (e.target.dataset?.qnew && !e.target.value.trim()) setTimeout(() => { if (qAdd === e.target.dataset.qnew) { qAdd = null; render(); } }, 150); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rec && t.files[0]) {   // the GM's recording: audio or video, uploaded (in memory) with a progress bar
    const file = t.files[0], kind = /^video/.test(file.type) ? 'video' : /^audio/.test(file.type) ? 'audio' : null, s = cur;
    if (!kind) { toast("That isn't audio or video."); return; }
    s.rec = { kind, name: file.name, size: file.size, dur: '', by: viewer, at: now(), url: URL.createObjectURL(file), up: 0 }; cFlip = false; render();
    const iv = setInterval(() => {
      if (cur !== s || !s.rec || s.rec.up == null) { clearInterval(iv); return; }
      s.rec.up += .05;
      if (s.rec.up >= 1) { clearInterval(iv); delete s.rec.up; render(); toast('Prototype: the recording is kept in memory only.'); return; }
      document.querySelectorAll('.vc-up i').forEach(i => i.style.width = Math.round(s.rec.up * 100) + '%');
    }, 120);
  }
  else if (t.dataset.torch && t.value) { cur.standIn = t.value; render(); toast(`${nameOf(t.value)} runs this session as ${CAMP.gmTitle}.`); }
  else if (t.dataset.acct && t.files[0]) {
    const file = t.files[0], f = { id: 'u' + Date.now(), name: file.name, type: file.type, size: file.size, by: viewer, at: now(), url: URL.createObjectURL(file) };
    if (kindOf(f) === 'TXT') file.text().then(x => { f.text = x.slice(0, 20000); cur.accounts.push(f); render(); });
    else { cur.accounts.push(f); render(); }
    toast('Prototype: kept in memory only.');
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'edit-form') return;
  e.preventDefault();
  const fd = new FormData(e.target), s = cur;
  s.title = fd.get('title').trim(); s.location = fd.get('location').trim(); s.online = fd.get('online') === 'on'; s.agenda = fd.get('agenda').trim(); s.vod = fd.get('vod').trim();
  if (fd.get('date')) s.date = new Date(fd.get('date')); if (fd.get('end')) s.end = new Date(fd.get('end'));
  ov = null; renderOv(); render();
});

if (cur.reel?.state === 'painting') paint(cur);
render();
Hearthside.GildedPanel.decorate();
const floor = Hearthside.Floor.mount(document.getElementById('floor'));
if (floor && floor.page) floor.page(1, false);
</script>
