name: Deploy Dev to Amazon ECS

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  ECR_BACKEND_REPOSITORY: personal-web-app-backend
  ECR_FRONTEND_REPOSITORY: personal-web-app-frontend
  ECS_SERVICE: personal-web-app-dev-service
  ECS_CLUSTER: dev-cluster
  ECS_TASK_DEFINITION: .aws/dev-task-definition.json
  CONTAINER_BACKEND: backend
  CONTAINER_FRONTEND: frontend
  # Hearthside (spec #69): the third container in the same task, on port 3002.
  ECR_HEARTHSIDE_REPOSITORY: personal-web-app-hearthside
  CONTAINER_HEARTHSIDE: hearthside
  PORTFOLIO_ORIGIN: https://deov.geoffthedeov.net
  HEARTHSIDE_ORIGIN: https://deov.hearthside.geoffthedeov.net

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Hearthside runs in the task from its first deploy, but nothing routes
      # to it until the ALB rule, certificate and DNS exist
      # (scripts/hearthside-wizard.sh). HEARTHSIDE_LIVE, a variable on the
      # GitHub "development" environment, is the switch the wizard turns on as
      # its last stage. On, it sets the backend's HEARTHSIDE_URL (#214's links,
      # #215's site allowlist) and the portfolio's NEXT_PUBLIC_HEARTHSIDE_URL
      # (#234's redirects). Off or unset, both are empty, so no link or
      # redirect leads to a host that isn't serving yet.
      - name: Read the Hearthside switch
        id: hearthside
        env:
          HEARTHSIDE_LIVE: ${{ vars.HEARTHSIDE_LIVE }}
        run: |
          case "$HEARTHSIDE_LIVE" in
            true)
              echo "url=$HEARTHSIDE_ORIGIN" >> "$GITHUB_OUTPUT"
              echo "Hearthside is live: HEARTHSIDE_URL=$HEARTHSIDE_ORIGIN" ;;
            ""|false)
              echo "url=" >> "$GITHUB_OUTPUT"
              echo "Hearthside isn't live yet: HEARTHSIDE_URL stays empty" ;;
            *)
              echo "::error::The development environment's HEARTHSIDE_LIVE must be true or false (got '$HEARTHSIDE_LIVE')"
              exit 1 ;;
          esac

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Hearthside's images have their own ECR repository, shared by dev and
      # prod like the others. The first deploy with Hearthside creates it; if
      # the deploy user may not, stop here, before any build or migration, and
      # let the wizard's first stage create it.
      - name: Make sure Hearthside's image repository exists
        run: |
          if aws ecr describe-repositories --repository-names "$ECR_HEARTHSIDE_REPOSITORY" >/dev/null 2>&1; then
            echo "ECR repository $ECR_HEARTHSIDE_REPOSITORY exists."
          elif aws ecr create-repository --repository-name "$ECR_HEARTHSIDE_REPOSITORY" >/dev/null; then
            echo "Created ECR repository $ECR_HEARTHSIDE_REPOSITORY."
          else
            echo "::error::No ECR repository $ECR_HEARTHSIDE_REPOSITORY, and the deploy user can't create it. Run 'scripts/hearthside-wizard.sh dev' (its stage 2 creates it), then re-run this deploy."
            exit 1
          fi

      # Schema migrations (backend/db/migrations, scripts/apply-migration.ts).
      # Dry-run now, so a migration that fails on dev's data stops the deploy
      # before the image builds; apply just before the deploy step, so the new
      # code never starts against the old schema. The URL comes from the same
      # Secrets Manager secret the task definition injects.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Dry-run pending migrations against the dev database
        working-directory: backend
        run: |
          DATABASE_URL=$(aws secretsmanager get-secret-value --secret-id personal-web-app/dev/DATABASE_URL --query SecretString --output text)
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" npx tsx scripts/apply-migration.ts --dry-run

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image to Amazon ECR
        id: build-backend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker buildx build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:dev \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push frontend image to Amazon ECR
        id: build-frontend-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        # From the repo root: the frontend is an npm workspace with the shared
        # packages and the root lockfile (#209).
        run: |
          docker buildx build --platform linux/amd64 \
            -f frontend/Dockerfile \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:dev \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --build-arg NEXT_PUBLIC_API_URL=https://deov.geoffthedeov.net/api \
            --build-arg NEXT_PUBLIC_HEARTHSIDE_URL=${{ steps.hearthside.outputs.url }} \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push Hearthside image to Amazon ECR
        id: build-hearthside-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        # From the repo root, like the portfolio (#216). Its /api rewrites go
        # to the backend container in the same task (the Dockerfile's default
        # BACKEND_URL), and the top bar links back to the portfolio's origin.
        run: |
          docker buildx build --platform linux/amd64 \
            -f hearthside/Dockerfile \
            -t $ECR_REGISTRY/$ECR_HEARTHSIDE_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_HEARTHSIDE_REPOSITORY:dev \
            --build-arg NEXT_PUBLIC_PORTFOLIO_URL=$PORTFOLIO_ORIGIN \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_HEARTHSIDE_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new backend image ID in the Amazon ECS task definition
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_BACKEND }}
          image: ${{ steps.build-backend-image.outputs.image }}
          # NOTE: JWT_SECRET, VAULT_ENCRYPTION_KEY, ANTHROPIC_API_KEY, ALPACA_API_KEY,
          # ALPACA_SECRET_KEY, DATABASE_URL and VAULT_TOKEN are injected via the ECS
          # `secrets` block (Secrets Manager valueFrom) in dev-task-definition.json — do
          # NOT re-add them below. ECS rejects a task definition where the same name
          # appears in both `environment` and `secrets` ("The secret name must be
          # unique..."), and an unset GitHub secret renders an empty string, which
          # hard-crashes the backend at boot (MUR-165/169). VAULT_TOKEN moved to the
          # secrets block in the Postgres migration — this exact duplicate broke the
          # 2026-07-20 deploy.
          # Comments cannot go inside the block below: the render action parses every
          # line as KEY=value and throws on lines without "=".
          environment-variables: |
            SYNC_API_KEY=${{ secrets.SYNC_API_KEY }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            SF_PASSWORD=${{ secrets.SF_PASSWORD }}
            SF_CLIENT_ID=${{ secrets.SF_CLIENT_ID }}
            SF_PRIVATE_KEY_CONTENT=${{ secrets.SF_PRIVATE_KEY_CONTENT }}
            FRONTEND_URL=https://deov.geoffthedeov.net
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GITHUB_VAULT_REPO=GeofftheDeov/obsidian-vault
            OBSIDIAN_VAULT_PATH=/obsidian-vault
            SESSION_COOKIE_NAME=gtd_session_deov
            SESSION_COOKIE_DOMAIN=.geoffthedeov.net
            SESSION_COOKIE_ORIGINS=https://deov.geoffthedeov.net,https://deov.hearthside.geoffthedeov.net
            HEARTHSIDE_URL=${{ steps.hearthside.outputs.url }}

      - name: Fill in the new frontend image ID in the Amazon ECS task definition
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_FRONTEND }}
          image: ${{ steps.build-frontend-image.outputs.image }}

      - name: Fill in the new Hearthside image ID in the Amazon ECS task definition
        id: hearthside-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          container-name: ${{ env.CONTAINER_HEARTHSIDE }}
          image: ${{ steps.build-hearthside-image.outputs.image }}

      - name: Apply pending migrations to the dev database
        working-directory: backend
        run: |
          DATABASE_URL=$(aws secretsmanager get-secret-value --secret-id personal-web-app/dev/DATABASE_URL --query SecretString --output text)
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" npx tsx scripts/apply-migration.ts --apply

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.hearthside-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
