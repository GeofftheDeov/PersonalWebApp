services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=pwa
      - POSTGRES_PASSWORD=pwa
      - POSTGRES_DB=personal_web_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://pwa:pwa@postgres:5432/personal_web_app
      - PORT=5000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:5000
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:5000}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-375045167895-0ft5nbpu6f2defkd4aflkag0l6470i7q.apps.googleusercontent.com}
    ports:
      - "3000:3000"
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:5000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    env_file:
      - ./backend/.env

  resume-review:
    # Stan's Resume Review project. Built from the sibling repo checkout —
    # requires C:\Users\Geoffrey\Documents\GitHub\resume_review to exist
    # alongside PersonalWebApp.
    build:
      context: ../resume_review/resume_review
      dockerfile: Dockerfile
    ports:
      # Host 5002 (5000/5001 are taken by backend); container listens on 5000.
      - "5002:5000"
    environment:
      # Optional server-side defaults; users can also supply their own
      # OpenAI/Anthropic key per request in the UI.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5}
      - FLASK_SECRET=${RESUME_REVIEW_FLASK_SECRET:-change-me}
    volumes:
      - resume_uploads:/app/backend/uploads

volumes:
  postgres_data:
  redis_data:
  resume_uploads:
